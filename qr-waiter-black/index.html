<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#E5E5E5'>
<meta name='color-scheme' content='light'>
<meta name='mobile-web-app-capable' content='yes'>
<title>E-Waiter Dashboard</title>
<link rel='manifest' href='./manifest.webmanifest'>
<link rel='icon' type='image/png' href='./icon-192.png'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --outer:#D8D8D8;--bg:#E5E5E5;--surface:#fff;--text:#111;--muted:#666;--line:#DDDDDD;
  --badge:#EAF4FF;--badge-text:#496B8B;--pastel-blue:#EAF4FF;--pastel-blue-border:#CFE3F6;
  --pastel-blue-text:#496B8B;
  --brand-blue:#B9CAEF;--shadow:0 18px 44px rgba(0,0,0,.08);
  --pending:#F4D98B;--pending-text:#3C3000;
  --accepted:#D9D9D9;--accepted-text:#333333;
  --delivery:#F2C29B;--delivery-text:#48240B;
  --kds:#C8DDBA;--kds-text:#1E341C;
  --urgent:#C8453C;
  --floating-control-bg:rgba(218,218,218,.82);
  --floating-control-shadow:0 8px 20px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.88)
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--outer)}
body{color:var(--text);font-family:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:none}
.app{position:relative;width:min(100%,540px);min-height:100dvh;margin:0 auto;background:var(--bg);box-shadow:var(--shadow);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.app::after{
  content:"";
  position:fixed;
  left:50%;
  bottom:0;
  z-index:29;
  width:min(100%,540px);
  height:calc(4px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:transparent;
  pointer-events:none;
}
.topbar{position:relative;z-index:20;background:rgba(229,229,229,.96);backdrop-filter:blur(12px);padding:calc(14px + env(safe-area-inset-top)) 18px 2px;border-bottom:0}
.toprow{
  min-height:66px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:12px;
}
.brand-stack{
  grid-column:1;
  justify-self:start;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:5px;
  min-width:138px;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none;
}
.brand-product{
  display:flex;
  align-items:center;
  gap:7px;
}
.app-name{
  font-size:16px;
  line-height:1;
  font-weight:850;
  letter-spacing:.025em;
  color:#111;
  white-space:nowrap;
}
.logo{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:0}
.logo-mark{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:.08em}
.logo-text{display:flex;flex-direction:column;align-items:flex-start}
.logo-text strong{font-size:15px;line-height:1;font-weight:800;letter-spacing:.08em}
.logo-text span{margin-top:4px;color:var(--muted);font-size:12px;font-weight:700}
.profile-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:16px;
  background:var(--surface);
  box-shadow:0 4px 14px rgba(0,0,0,.045);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:transform .32s cubic-bezier(.16,1,.3,1);
}
.profile-btn:active{transform:scale(.93)}
.profile-btn svg{width:26px;height:26px}
.restaurant-name{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  line-height:1;
  overflow:hidden;
}

.restaurant-kicker{
  display:none;
  font-size:10px;
  line-height:1;
  font-weight:800;
  letter-spacing:.18em;
  color:#707070;
  text-transform:uppercase;
  margin-bottom:4px;
  white-space:nowrap;
}
.restaurant-word{
  font-family:"Playfair Display", Georgia, "Times New Roman", serif;
  font-size:15px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:-.015em;
  color:#111;
  white-space:nowrap;
}

.top-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  max-width:48px;
  overflow:visible;
}
.top-logo img{
  display:none;
}
.top-logo::before{
  content:"";
  width:48px;
  height:48px;
  flex:0 0 auto;
  border-radius:16px;
  background-color:var(--brand-blue);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%201536%201536%27%3E%3Crect%20width=%271536%27%20height=%271536%27%20fill=%27%23B9CAEF%27/%3E%3Cpath%20d=%27M343,504L346,1126L767,771L1192,1122L1189,501L1071,597L1070,890L766,634L465,891L464,597Z%27%20fill=%27white%27/%3E%3Cpath%20d=%27M598,387L599,627L766,518L937,626L936,386L769,493Z%27%20fill=%27%23111%27/%3E%3C/svg%3E");
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  box-shadow:0 6px 14px rgba(73,107,139,.14);
}
.profile-btn{
  grid-column:3;
  justify-self:end;
}
main{padding:0 14px 18px}
.compact-row{
  position:sticky;
  top:0;
  z-index:18;
  margin:0 -14px 2px;
  padding:0 12px 8px;
  background:transparent;
}
.selector-container{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none;
}
.inline-wrap{position:relative;min-width:0}
.inline-selector{
  width:100%;
  min-width:0;
  height:42px;
  border:0;
  border-radius:16px;
  background:var(--surface);
  box-shadow:0 4px 14px rgba(0,0,0,.045);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
  transition:transform .34s cubic-bezier(.16,1,.3,1),box-shadow .28s ease;
}
.inline-selector:active{transform:scale(.96)}
.inline-selector[aria-expanded='true']{transform:scale(1.025)}
.selector-value-wrap{min-width:0;display:flex;align-items:center;gap:9px}
.inline-selector .value{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px;line-height:1.2;font-weight:850;letter-spacing:-.01em;white-space:nowrap}
.inline-selector .meta{font-size:13px;line-height:1.2;color:var(--muted);font-weight:700;white-space:nowrap}
.inline-selector svg{width:16px;height:16px;flex:0 0 auto;stroke:#4d4d4d;transition:transform .34s cubic-bezier(.16,1,.3,1)}
.inline-selector[aria-expanded='true'] svg{transform:rotate(180deg)}
.inline-wrap.right .menu{left:auto;right:0}
.menu{position:absolute;top:100%;left:0;min-width:180px;margin-top:8px;background:#fff;border:0;border-radius:18px;box-shadow:0 16px 32px rgba(0,0,0,.10);padding:8px;display:block;z-index:25;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.98);transform-origin:top center;transition:opacity .22s ease,transform .32s cubic-bezier(.16,1,.3,1),visibility 0s linear .32s}
.menu.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);transition-delay:0s}
.menu-item{width:100%;min-height:42px;border:0;border-radius:12px;background:transparent;text-align:left;padding:0 12px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px}
.menu-item.active{background:#111;color:#fff}
.status-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.status-dot.pending{background:var(--pending)}
.status-dot.accepted{background:var(--accepted)}
.status-dot.delivery{background:var(--delivery)}
.status-dot.kds{background:var(--kds)}
#typeMenu .menu-item.active{color:#111}
#typeMenu .menu-item[data-type='pending'].active{background:var(--pending);color:var(--pending-text)}
#typeMenu .menu-item[data-type='accepted'].active{background:var(--accepted);color:var(--accepted-text)}
#typeMenu .menu-item[data-type='delivery'].active{background:var(--delivery);color:var(--delivery-text)}
#typeMenu .menu-item[data-type='kds'].active{background:var(--kds);color:var(--kds-text)}
.card-list{display:grid;gap:10px}
.order-card{background:var(--surface);border:0;border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.045)}
.card-main{width:100%;border:0;background:transparent;text-align:left;padding:12px}
.card-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid #EEE}
.card-top:has(.table-badge){grid-template-columns:1fr auto auto;gap:8px}
.card-top:has(.table-badge) .order-id{grid-column:1;grid-row:1}
.card-top:has(.table-badge) .table-badge{grid-column:2;grid-row:1}
.card-top:has(.table-badge) .age{grid-column:3;grid-row:1}
.table-badge{min-width:64px;height:34px;padding:0 9px;border-radius:17px;background:#EFEFEF;color:#111;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.table-badge svg{order:2;width:17px;height:17px;stroke:#111}
.table-badge span{order:1;font-size:17px;line-height:1;font-weight:800;color:#111}
.order-id strong{font-size:17px;font-weight:800}
.age{min-width:64px;height:34px;padding:0 9px;border-radius:17px;background:#EFEFEF;display:grid;place-items:center;font-size:15px;font-weight:800;white-space:nowrap}
.age-warning{background:#F6E4AE;color:#5C4707}
.age-elevated,.age-critical{background:#F7DAD7;color:#7D2B25}
.age-ready{background:var(--kds);color:var(--kds-text)}
.card-content{margin-top:10px;display:grid;gap:8px}
.item-line{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:14px;line-height:1.3}
.item-main{display:flex;align-items:baseline;gap:6px}
.item-name{font-weight:700}.qty{font-weight:800}
.item-note{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:600}
.item-price{font-weight:700;white-space:nowrap}
.card-bottom{margin-top:10px;padding-top:10px;border-top:1px solid #EEE;display:flex;justify-content:flex-end;gap:8px;font-size:14px}
.card-bottom .label{font-weight:700}.card-bottom .money{font-weight:800}
.card-actions{padding:0 12px 12px}
.btn{width:100%;min-height:48px;border-radius:16px;border:0;background:#111;color:#fff;font-size:14px;font-weight:800;letter-spacing:-.01em;box-shadow:0 7px 16px rgba(0,0,0,.11);cursor:pointer}
.delivery-tag{min-width:86px;height:38px;padding:0 12px;border-radius:20px;background:var(--delivery);color:var(--delivery-text);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800}
.bottom-nav{
  --active-offset:0%;
  position:fixed;
  left:50%;
  bottom:calc(-6px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:30;
  width:min(calc(100% - 24px),500px);
  height:64px;
  padding:4px;
  border:1px solid rgba(17,17,17,.12);
  border-radius:32px;
  background:rgba(255,255,255,.82);
  box-shadow:
    0 18px 42px rgba(0,0,0,.20),
    0 5px 14px rgba(0,0,0,.10),
    inset 0 0 0 1px rgba(255,255,255,.55),
    inset 0 1px 0 rgba(255,255,255,.88);
  backdrop-filter:blur(18px) saturate(145%);
  -webkit-backdrop-filter:blur(18px) saturate(145%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  isolation:isolate;
  overflow:hidden;
}
.bottom-nav::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 38%,transparent 68%,rgba(0,0,0,.025));
}
.nav-indicator{
  position:absolute;
  z-index:1;
  top:4px;
  left:4px;
  width:calc(20% - 1.6px);
  height:56px;
  border-radius:28px;
  background:#111;
  box-shadow:
    0 7px 18px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 0 0 1px rgba(0,0,0,.20);
  transform:translateX(var(--active-offset)) scale(1.055);
  transition:transform .48s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
.nav-btn,
.center-plus{
  width:100%;
  height:56px;
  margin:0;
  border:0;
  border-radius:28px;
  background:transparent;
  display:grid;
  place-items:center;
  color:#4A4A4A;
  cursor:pointer;
  padding:0;
  position:relative;
  z-index:2;
  box-shadow:none;
  transform:none;
  transition:color .3s ease, transform .38s cubic-bezier(.16,1,.3,1);
}
.nav-btn svg,
.center-plus svg{
  width:25px;
  height:25px;
  transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .3s ease;
}
.center-plus svg{
  width:27px;
  height:27px;
}
.nav-btn.active,
.center-plus.active{
  color:#fff;
  transform:scale(1.075);
}
.bottom-nav button:focus-visible{
  outline:2px solid var(--pastel-blue-border);
  outline-offset:-4px;
}
.nav-btn.active svg,
.center-plus.active svg{
  transform:scale(1.10);
}
.nav-btn:active svg,
.center-plus:active svg{
  transform:scale(.88);
}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .18s ease}
.overlay.show{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;
  top:0;
  right:0;
  z-index:50;
  width:min(88vw,340px);
  height:100dvh;
  background:var(--bg);
  box-shadow:-18px 0 42px rgba(0,0,0,.14);
  transform:translateX(100%);
  transition:transform .22s ease;
  display:flex;
  flex-direction:column;
}
.drawer.show{transform:translateX(0)}

.drawer-head{
  padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.drawer-head-title{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.02em;
}
.drawer-close{
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.drawer-close:active{background:#EAEAEA}

.drawer-body{
  padding:0 14px 18px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  flex:1;
}

.profile-summary{
  background:#FFFFFF;
  border:0;
  border-radius:20px;
  padding:14px;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px;
  align-items:center;
}
.profile-avatar{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#111111;
  color:#FFFFFF;
  display:grid;
  place-items:center;
  font-size:15px;
  font-weight:850;
  letter-spacing:.02em;
}
.profile-copy{
  min-width:0;
}
.profile-name{
  font-size:16px;
  font-weight:850;
  line-height:1.15;
}
.profile-role{
  margin-top:3px;
  color:#666;
  font-size:12px;
  font-weight:700;
}
.profile-context{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#555;
  font-size:12px;
  font-weight:700;
}
.profile-context-dot{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#9A9A9A;
}

.drawer-section{
  margin-top:20px;
}
.drawer-section-title{
  margin:0 4px 8px;
  color:#747474;
  font-size:11px;
  font-weight:850;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.language-segment{
  padding:4px;
  border-radius:16px;
  border:0;
  background:var(--pastel-blue);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}
.lang-option{
  min-height:42px;
  border:0;
  border-radius:13px;
  background:transparent;
  color:#666;
  font-size:13px;
  font-weight:850;
  cursor:pointer;
}
.lang-option.active{
  background:#111111;
  color:#FFFFFF;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.settings-list{
  overflow:hidden;
  border-radius:18px;
  background:#FFFFFF;
  border:0;
}
.drawer-row{
  width:100%;
  min-height:54px;
  border:0;
  background:#FFFFFF;
  padding:0 13px;
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:center;
  text-align:left;
  cursor:pointer;
}
.drawer-row + .drawer-row{
  border-top:1px solid #EEEEEE;
}
.drawer-row:active{
  background:#F7F7F7;
}
.drawer-row-icon{
  width:32px;
  height:32px;
  border-radius:11px;
  background:var(--pastel-blue);
  display:grid;
  place-items:center;
  color:var(--pastel-blue-text);
}
.drawer-row-icon svg{
  width:17px;
  height:17px;
}
.drawer-row-copy{
  min-width:0;
}
.drawer-row-label{
  display:block;
  font-size:14px;
  font-weight:780;
}
.drawer-row-sub{
  display:block;
  margin-top:2px;
  color:#777;
  font-size:11px;
  font-weight:650;
}
.drawer-row-chevron{
  color:#A3A3A3;
  font-size:19px;
  line-height:1;
}

.drawer-footer{
  margin-top:auto;
  padding-top:20px;
}
.logout-row{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:16px;
  background:#FFFFFF;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#8E2925;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.logout-row:active{background:#FAF4F4}
.logout-row svg{
  width:18px;
  height:18px;
}
.drawer-app{
  padding:12px 4px 0;
  color:#999;
  font-size:10px;
  font-weight:700;
  text-align:center;
}

.hidden{display:none !important}


.bill-bell{position:relative}
.bill-badge{
  position:absolute;
  top:9px;
  left:50%;
  right:auto;
  transform:translateX(7px);
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:#B83C35;
  color:#fff;
  border:0;
  display:grid;
  place-items:center;
  font-size:9px;
  line-height:1;
  font-weight:850;
}
@media (prefers-reduced-motion:reduce){
  .nav-indicator,
  .nav-btn,
  .center-plus,
  .nav-btn svg,
  .center-plus svg,
  .profile-btn,
  .inline-selector,
  .inline-selector svg,
  .menu{transition:none}
}
.bill-panel-overlay{
  position:fixed;
  inset:0;
  z-index:55;
  background:rgba(0,0,0,.28);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.bill-panel-overlay.show{opacity:1;pointer-events:auto}
.bill-panel{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:60;
  width:min(100%,540px);
  transform:translate(-50%,100%);
  transition:transform .22s ease;
  background:#fff;
  border-radius:24px 24px 0 0;
  box-shadow:0 -18px 40px rgba(0,0,0,.16);
  padding:10px 14px calc(18px + env(safe-area-inset-bottom));
}
.bill-panel.show{transform:translate(-50%,0)}
.bill-handle{
  width:38px;
  height:4px;
  margin:0 auto 12px;
  border-radius:999px;
  background:#D8D8D8;
}
.bill-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.bill-panel-head strong{font-size:17px;font-weight:850}
.bill-close{
  width:38px;height:38px;
  border:0;border-radius:12px;
  background:#F3F3F3;
  display:grid;place-items:center;
  cursor:pointer;
}
.bill-list{display:grid;gap:9px}

<script>
(() => {
  const STORAGE_KEY = 'e-waiter-sidebar-functional-mock-v1';
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const minutesAgo = minutes => Date.now() - minutes * 60000;
  const money = value => `${Number(value).toLocaleString('en-US')} ден`;
  const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));

  const seedState = () => ({
    nextOrder: 192,
    language: 'MK',
    orders: [
      {id:184,section:'Terrace',table:8,status:'pending',createdAt:minutesAgo(3),assignedTo:null,items:[{name:'Classic Burger',qty:2,price:380,note:'1 × no onion'},{name:'French fries',qty:1,price:180},{name:'Coca-Cola 0.25',qty:1,price:140}]},
      {id:183,section:'Terrace',table:12,status:'pending',createdAt:minutesAgo(7),assignedTo:null,items:[{name:'Caesar salad',qty:1,price:420,note:'Dressing on side'},{name:'Chicken pasta',qty:2,price:450},{name:'Sparkling water',qty:2,price:110}]},
      {id:182,section:'Terrace',table:3,status:'pending',createdAt:minutesAgo(9),assignedTo:null,items:[{name:'Margherita Pizza',qty:1,price:390,note:'Extra basil'},{name:'Mineral water 0.75',qty:1,price:160}]},
      {id:180,section:'Terrace',table:6,status:'pending',createdAt:minutesAgo(11),assignedTo:null,items:[{name:'Beef Steak',qty:1,price:830,note:'Medium rare'},{name:'Grilled vegetables',qty:1,price:260},{name:'Skopsko 0.5',qty:2,price:180}]},
      {id:179,section:'Terrace',table:15,status:'pending',createdAt:minutesAgo(13),assignedTo:null,items:[{name:'Club Sandwich',qty:2,price:360,note:'One without mayo'},{name:'French fries',qty:2,price:180},{name:'Coca-Cola Zero',qty:2,price:140}]},
      {id:178,section:'Terrace',table:10,status:'pending',createdAt:minutesAgo(16),assignedTo:null,items:[{name:'Pancakes',qty:2,price:290,note:'Chocolate on side'},{name:'Cappuccino',qty:2,price:180}]},
      {id:175,section:'Terrace',table:2,status:'accepted',createdAt:minutesAgo(14),acceptedAt:minutesAgo(5),assignedTo:'Kristijan',items:[{name:'Pasta Alfredo',qty:1,price:430},{name:'Shopska salad',qty:1,price:220}]},
      {id:94,section:'Terrace',table:null,status:'delivery',createdAt:minutesAgo(6),assignedTo:null,items:[{name:'Chicken burger',qty:2,price:380},{name:'Loaded fries',qty:1,price:260}]},
      {id:188,section:'Terrace',table:6,status:'kds',createdAt:minutesAgo(18),acceptedAt:minutesAgo(12),ready:true,assignedTo:'Kristijan',items:[{name:'Margherita pizza',qty:1,price:390}]},
      {id:190,section:'Main Hall',table:7,status:'pending',createdAt:minutesAgo(5),assignedTo:null,items:[{name:'Chicken pasta',qty:1,price:450},{name:'House wine',qty:2,price:210}]},
      {id:176,section:'Main Hall',table:4,status:'accepted',createdAt:minutesAgo(19),acceptedAt:minutesAgo(8),assignedTo:'Elena',items:[{name:'Beef Steak',qty:2,price:830},{name:'Shopska salad',qty:1,price:220}]},
      {id:191,section:'Garden',table:5,status:'pending',createdAt:minutesAgo(2),assignedTo:null,items:[{name:'Club Sandwich',qty:1,price:360},{name:'Fresh orange juice',qty:1,price:190}]}
    ],
    bills: [
      {id:'bill-8',orderId:184,table:8,section:'Terrace',requestedAt:minutesAgo(2),total:1080,status:'open'},
      {id:'bill-4',orderId:176,table:4,section:'Main Hall',requestedAt:minutesAgo(5),total:1880,status:'open'}
    ]
  });

  const menuCatalog = [
    {id:'burger',name:'Classic Burger',category:'Mains',price:380,popular:true},
    {id:'pizza',name:'Margherita Pizza',category:'Mains',price:390,popular:true},
    {id:'pasta',name:'Chicken pasta',category:'Mains',price:450,popular:true},
    {id:'steak',name:'Beef Steak',category:'Mains',price:830},
    {id:'club',name:'Club Sandwich',category:'Mains',price:360},
    {id:'shopska',name:'Shopska salad',category:'Starters',price:220,popular:true},
    {id:'caesar',name:'Caesar salad',category:'Starters',price:420},
    {id:'fries',name:'French fries',category:'Starters',price:180},
    {id:'cola',name:'Coca-Cola 0.25',category:'Drinks',price:140,popular:true},
    {id:'water',name:'Mineral water 0.75',category:'Drinks',price:160},
    {id:'beer',name:'Skopsko 0.5',category:'Drinks',price:180},
    {id:'coffee',name:'Cappuccino',category:'Drinks',price:180},
    {id:'pancakes',name:'Pancakes',category:'Desserts',price:290,popular:true},
    {id:'cake',name:'Chocolate cake',category:'Desserts',price:260}
  ];
  const categories = ['Popular', 'Starters', 'Mains', 'Drinks', 'Desserts'];

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.orders) && Array.isArray(saved.bills)) return saved;
    } catch (error) {}
    return seedState();
  }

  let state = loadState();
  let currentSection = 'Terrace';
  let currentType = 'pending';
  let currentView = 'home';
  let activeCategory = 'Popular';
  let cart = {};
  let activeDetail = null;
  let toastTimer = null;

  const elements = {
    filterBar: $('#filterBar'),
    sectionBtn: $('#sectionBtn'), sectionMenu: $('#sectionMenu'), sectionValue: $('#sectionValue'),
    typeBtn: $('#typeBtn'), typeMenu: $('#typeMenu'), typeValue: $('#typeValue'), typeDot: $('#typeDot'),
    searchView: $('#searchView'), searchInput: $('#searchInput'), searchResults: $('#searchResults'), searchCount: $('#searchCount'), searchEmpty: $('#searchEmpty'),
    myOrdersView: $('#myOrdersView'), myOrdersList: $('#myOrdersList'), myOrdersCount: $('#myOrdersCount'), myOrdersEmpty: $('#myOrdersEmpty'),
    overlay: $('#overlay'), drawer: $('#drawer'),
    bottomNav: $('.bottom-nav'), billBell: $('#billBell'), billBadge: $('.bill-badge'), billPanel: $('#billPanel'), billOverlay: $('#billOverlay'), billList: $('#billList'),
    detailSheet: $('#detailSheet'), detailOverlay: $('#detailOverlay'), detailTitle: $('#detailTitle'), detailContent: $('#detailContent'),
    orderBuilder: $('#orderBuilder'), builderSection: $('#builderSection'), builderTable: $('#builderTable'), categoryTabs: $('#categoryTabs'), menuList: $('#menuList'), cartPreview: $('#cartPreview'), cartSummary: $('#cartSummary'), cartTotal: $('#cartTotal'), submitOrder: $('#submitOrder'),
    toast: $('#toast')
  };
  const lists = {pending:$('#pendingList'),accepted:$('#acceptedList'),delivery:$('#deliveryList'),kds:$('#kdsList')};
  const navItems = $$('.bottom-nav [data-nav-index]');

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function orderTotal(order) {
    return order.items.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function orderAge(order) {
    if (order.status === 'kds' && order.ready) return {label:'Ready',className:'age-ready'};
    const minutes = Math.max(0, Math.floor((Date.now() - order.createdAt) / 60000));
    const className = minutes >= 12 ? 'age-critical' : minutes >= 8 ? 'age-warning' : '';
    return {label:`${minutes} min`,className};
  }

  function requestAge(timestamp) {
    const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
    return minutes === 0 ? 'Just now' : `${minutes} min ago`;
  }

  function statusLabel(status) {
    return ({pending:'Pending',accepted:'Accepted',delivery:'Delivery',kds:'KDS ready',completed:'Served'})[status] || status;
  }

  function actionFor(order) {
    if (order.status === 'pending' || order.status === 'delivery') return {action:'accept',label:'Accept'};
    if (order.status === 'accepted') return {action:'send',label:'Send to kitchen'};
    if (order.status === 'kds') return {action:'serve',label:'Mark served'};
    return null;
  }

  const tableIcon = "<svg viewBox='0 0 24 24' fill='none' stroke-width='1.9'><ellipse cx='12' cy='8' rx='8' ry='3'></ellipse><path d='M8 10v7M16 10v7M7 17h10'></path></svg>";

  function orderCard(order, includeStatus = false) {
    const age = orderAge(order);
    const action = actionFor(order);
    const origin = order.status === 'delivery'
      ? "<span class='delivery-tag'>Delivery</span>"
      : `<span class='table-badge'>${tableIcon}<span>${escapeHtml(order.table)}</span></span>`;
    const items = order.items.map(item => `
      <div class='item-line'>
        <div><span class='item-main'><span class='item-name'>${escapeHtml(item.name)}</span><span class='qty'>${item.qty}x</span></span>${item.note ? `<span class='item-note'>${escapeHtml(item.note)}</span>` : ''}</div>
        <span class='item-price'>${money(item.price * item.qty)}</span>
      </div>`).join('');
    return `
      <article class='order-card'>
        <button class='card-main' type='button' data-open-order='${order.id}' aria-label='Open order ${order.id}'>
          <div class='card-top'>
            ${origin}
            <span class='order-id'><strong>Order #${order.id}</strong><small>${escapeHtml(order.section)}${order.assignedTo ? ` · ${escapeHtml(order.assignedTo)}` : ''}</small></span>
            <span class='age ${age.className}'>${age.label}</span>
          </div>
          <div class='card-content'>${items}</div>
          <div class='card-bottom'>${includeStatus ? `<span class='status-chip ${order.status}'>${statusLabel(order.status)}</span>` : ''}<span class='label'>Total:</span><span class='money'>${money(orderTotal(order))}</span></div>
        </button>
        ${action ? `<div class='card-actions'><button class='btn' type='button' data-order-action='${action.action}' data-order-id='${order.id}'>${action.label}</button></div>` : ''}
      </article>`;
  }

  function closeMenus() {
    elements.sectionMenu.classList.remove('show');
    elements.typeMenu.classList.remove('show');
    elements.sectionBtn.setAttribute('aria-expanded','false');
    elements.typeBtn.setAttribute('aria-expanded','false');
  }

  function updateTypeCounts() {
    $$('#typeMenu [data-type]').forEach(button => {
      let count = $('.menu-count', button);
      if (!count) {
        count = document.createElement('span');
        count.className = 'menu-count';
        button.appendChild(count);
      }
      count.textContent = state.orders.filter(order => order.section === currentSection && order.status === button.dataset.type).length;
    });
  }

  function renderHome() {
    Object.values(lists).forEach(list => { list.classList.add('hidden'); list.innerHTML = ''; });
    const visible = state.orders
      .filter(order => order.section === currentSection && order.status === currentType)
      .sort((a,b) => b.createdAt - a.createdAt);
    const list = lists[currentType];
    list.classList.remove('hidden');
    list.innerHTML = visible.length
      ? visible.map(order => orderCard(order)).join('')
      : `<div class='empty-state'><strong>No ${currentType} orders</strong><span>${escapeHtml(currentSection)} is clear for now.</span></div>`;
    updateTypeCounts();
  }

  function renderSearch() {
    const query = elements.searchInput.value.trim().toLowerCase();
    const results = state.orders.filter(order => {
      const haystack = [order.id, order.table || '', order.section, statusLabel(order.status), order.assignedTo || '', ...order.items.flatMap(item => [item.name,item.note || ''])].join(' ').toLowerCase();
      return !query || haystack.includes(query);
    }).sort((a,b) => b.createdAt - a.createdAt);
    elements.searchCount.textContent = `${results.length} ${results.length === 1 ? 'order' : 'orders'}`;
    elements.searchResults.innerHTML = results.map(order => orderCard(order,true)).join('');
    elements.searchEmpty.classList.toggle('hidden', results.length > 0);
  }

  function renderMyOrders() {
    const orders = state.orders.filter(order => order.assignedTo === 'Kristijan' && order.status !== 'completed').sort((a,b) => b.createdAt - a.createdAt);
    elements.myOrdersCount.textContent = `${orders.length} active`;
    elements.myOrdersList.innerHTML = orders.map(order => orderCard(order,true)).join('');
    elements.myOrdersEmpty.classList.toggle('hidden', orders.length > 0);
  }

  function setNavActive(index) {
    elements.bottomNav.style.setProperty('--active-offset', `${index * 100}%`);
    navItems.forEach(item => {
      const active = Number(item.dataset.navIndex) === index;
      item.classList.toggle('active', active);
      if (active) item.setAttribute('aria-current','page'); else item.removeAttribute('aria-current');
    });
  }

  function viewNavIndex() {
    return currentView === 'search' ? 1 : currentView === 'mine' ? 3 : 0;
  }

  function showView(view) {
    currentView = view;
    elements.filterBar.classList.toggle('hidden', view !== 'home');
    elements.searchView.classList.toggle('hidden', view !== 'search');
    elements.myOrdersView.classList.toggle('hidden', view !== 'mine');
    Object.values(lists).forEach(list => list.classList.add('hidden'));
    if (view === 'home') renderHome();
    if (view === 'search') { renderSearch(); window.setTimeout(() => elements.searchInput.focus(), 120); }
    if (view === 'mine') renderMyOrders();
    setNavActive(viewNavIndex());
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    elements.toast.textContent = message;
    elements.toast.classList.add('show');
    toastTimer = window.setTimeout(() => elements.toast.classList.remove('show'), 2200);
  }

  function renderAll() {
    if (currentView === 'home') renderHome();
    if (currentView === 'search') renderSearch();
    if (currentView === 'mine') renderMyOrders();
    renderBills();
  }

  function runOrderAction(orderId, action) {
    const order = state.orders.find(candidate => candidate.id === Number(orderId));
    if (!order) return;
    if (action === 'accept') {
      order.status = 'accepted'; order.assignedTo = 'Kristijan'; order.acceptedAt = Date.now();
      showToast(`Order #${order.id} accepted`);
    } else if (action === 'send') {
      order.status = 'kds'; order.ready = true; order.kdsAt = Date.now();
      showToast(`Order #${order.id} sent to kitchen`);
    } else if (action === 'serve') {
      order.status = 'completed'; order.servedAt = Date.now();
      showToast(`Order #${order.id} marked as served`);
    }
    saveState();
    closeDetail();
    renderAll();
  }

  function openOrderDetail(orderId) {
    const order = state.orders.find(candidate => candidate.id === Number(orderId));
    if (!order) return;
    activeDetail = {kind:'order',id:order.id};
    const age = orderAge(order);
    const action = actionFor(order);
    elements.detailTitle.textContent = `Order #${order.id}`;
    elements.detailContent.innerHTML = `
      <div class='detail-meta'>
        <span>${order.status === 'delivery' ? 'Delivery' : `Table ${escapeHtml(order.table)}`}</span>
        <span>${escapeHtml(order.section)}</span>
        <span class='status-chip ${order.status}'>${statusLabel(order.status)}</span>
        <span>${age.label}</span>
      </div>
      <div class='detail-items'>${order.items.map(item => `<div class='detail-item'><div><strong>${item.qty} × ${escapeHtml(item.name)}</strong>${item.note ? `<small>${escapeHtml(item.note)}</small>` : ''}</div><span>${money(item.price * item.qty)}</span></div>`).join('')}</div>
      <div class='detail-total'><span>Total</span><span>${money(orderTotal(order))}</span></div>
      ${action ? `<div class='detail-actions'><button class='btn' type='button' data-order-action='${action.action}' data-order-id='${order.id}'>${action.label}</button></div>` : ''}`;
    elements.detailOverlay.classList.add('show');
    elements.detailSheet.classList.add('show');
    document.body.classList.add('body-locked');
  }

  function openBillDetail(billId) {
    const bill = state.bills.find(candidate => candidate.id === billId);
    if (!bill) return;
    const order = state.orders.find(candidate => candidate.id === bill.orderId);
    activeDetail = {kind:'bill',id:bill.id};
    elements.detailTitle.textContent = `Table ${bill.table} bill`;
    elements.detailContent.innerHTML = `
      <div class='detail-meta'><span>${escapeHtml(bill.section)}</span><span>Requested ${requestAge(bill.requestedAt)}</span></div>
      <div class='detail-items'>${order ? order.items.map(item => `<div class='detail-item'><div><strong>${item.qty} × ${escapeHtml(item.name)}</strong></div><span>${money(item.price * item.qty)}</span></div>`).join('') : `<div class='detail-item'><strong>Table total</strong><span>${money(bill.total)}</span></div>`}</div>
      <div class='detail-total'><span>Total</span><span>${money(bill.total)}</span></div>
      <div class='detail-actions'><button class='btn' type='button' data-pay-bill='${escapeHtml(bill.id)}'>Mark as paid</button></div>`;
    elements.detailOverlay.classList.add('show');
    elements.detailSheet.classList.add('show');
    document.body.classList.add('body-locked');
  }

  function closeDetail() {
    activeDetail = null;
    elements.detailOverlay.classList.remove('show');
    elements.detailSheet.classList.remove('show');
    if (!elements.orderBuilder.classList.contains('show')) document.body.classList.remove('body-locked');
  }

  function renderBills() {
    const openBills = state.bills.filter(bill => bill.status === 'open').sort((a,b) => a.requestedAt - b.requestedAt);
    elements.billBadge.textContent = openBills.length;
    elements.billBadge.classList.toggle('hidden', openBills.length === 0);
    elements.billBell.setAttribute('aria-label', `Bill requests, ${openBills.length} active`);
    elements.billList.innerHTML = openBills.length ? openBills.map(bill => `
      <div class='bill-request'>
        <div class='bill-table'>${bill.table}</div>
        <div class='bill-copy'><strong>Bill requested</strong><span>${escapeHtml(bill.section)} · ${requestAge(bill.requestedAt)}</span></div>
        <button class='bill-open' type='button' data-bill-open='${escapeHtml(bill.id)}'>Open</button>
      </div>`).join('') : `<div class='empty-state'><strong>No bill requests</strong><span>New requests will appear here.</span></div>`;
  }

  function openBills() {
    renderBills();
    elements.billPanel.classList.add('show');
    elements.billOverlay.classList.add('show');
    setNavActive(4);
  }

  function closeBills() {
    elements.billPanel.classList.remove('show');
    elements.billOverlay.classList.remove('show');
    setNavActive(viewNavIndex());
  }

  function renderBuilder() {
    elements.categoryTabs.innerHTML = categories.map(category => `<button class='category-tab ${category === activeCategory ? 'active' : ''}' type='button' data-category='${category}'>${category}</button>`).join('');
    const visibleProducts = menuCatalog.filter(item => activeCategory === 'Popular' ? item.popular : item.category === activeCategory);
    elements.menuList.innerHTML = visibleProducts.map(item => {
      const quantity = cart[item.id] || 0;
      return `<div class='product-row'><div class='product-copy'><strong>${escapeHtml(item.name)}</strong><span>${money(item.price)}</span></div>${quantity ? `<div class='stepper'><button type='button' data-cart='decrease' data-item='${item.id}' aria-label='Remove one ${escapeHtml(item.name)}'>−</button><span>${quantity}</span><button type='button' data-cart='increase' data-item='${item.id}' aria-label='Add one ${escapeHtml(item.name)}'>+</button></div>` : `<button class='add-item' type='button' data-cart='increase' data-item='${item.id}' aria-label='Add ${escapeHtml(item.name)}'>+</button>`}</div>`;
    }).join('');
    const cartItems = Object.entries(cart).filter(([,quantity]) => quantity > 0).map(([itemId,quantity]) => ({item:menuCatalog.find(candidate => candidate.id === itemId),quantity})).filter(entry => entry.item);
    const itemCount = cartItems.reduce((sum,entry) => sum + entry.quantity,0);
    const total = cartItems.reduce((sum,entry) => sum + entry.item.price * entry.quantity,0);
    elements.cartSummary.textContent = itemCount ? `${itemCount} ${itemCount === 1 ? 'item' : 'items'} added` : 'No items yet';
    elements.cartTotal.textContent = money(total);
    elements.submitOrder.disabled = itemCount === 0;
    elements.cartPreview.classList.toggle('hidden', itemCount === 0);
    elements.cartPreview.innerHTML = itemCount ? `<h3>Current order</h3>${cartItems.map(entry => `<div class='cart-preview-row'><span>${entry.quantity} × ${escapeHtml(entry.item.name)}</span><strong>${money(entry.item.price * entry.quantity)}</strong></div>`).join('')}` : '';
  }

  function populateTables(selected = '1') {
    elements.builderTable.innerHTML = Array.from({length:20},(_,index) => `<option value='${index + 1}' ${String(index + 1) === String(selected) ? 'selected' : ''}>Table ${index + 1}</option>`).join('');
  }

  function openBuilder() {
    cart = {};
    activeCategory = 'Popular';
    elements.builderSection.value = currentSection;
    populateTables('1');
    renderBuilder();
    elements.orderBuilder.classList.add('show');
    elements.orderBuilder.setAttribute('aria-hidden','false');
    document.body.classList.add('body-locked');
    setNavActive(2);
  }

  function closeBuilder() {
    elements.orderBuilder.classList.remove('show');
    elements.orderBuilder.setAttribute('aria-hidden','true');
    document.body.classList.remove('body-locked');
    setNavActive(viewNavIndex());
  }

  function submitNewOrder() {
    const items = Object.entries(cart).filter(([,quantity]) => quantity > 0).map(([itemId,quantity]) => {
      const product = menuCatalog.find(item => item.id === itemId);
      return {name:product.name,price:product.price,qty:quantity};
    });
    if (!items.length) return;
    const order = {id:state.nextOrder++,section:elements.builderSection.value,table:Number(elements.builderTable.value),status:'pending',createdAt:Date.now(),assignedTo:null,items};
    state.orders.unshift(order);
    saveState();
    closeBuilder();
    currentSection = order.section;
    currentType = 'pending';
    syncFilters();
    showView('home');
    showToast(`Order #${order.id} sent`);
  }

  function syncFilters() {
    elements.sectionValue.textContent = currentSection;
    $$('#sectionMenu [data-section]').forEach(button => button.classList.toggle('active', button.dataset.section === currentSection));
    const activeType = $(`#typeMenu [data-type='${currentType}']`);
    $$('#typeMenu [data-type]').forEach(button => button.classList.toggle('active', button === activeType));
    elements.typeValue.textContent = ({pending:'Pending',accepted:'Accepted',delivery:'Delivery',kds:'KDS'})[currentType];
    elements.typeDot.className = `status-dot ${currentType}`;
  }

  elements.sectionBtn.onclick = event => {
    event.stopPropagation();
    const shouldOpen = !elements.sectionMenu.classList.contains('show');
    closeMenus();
    if (shouldOpen) { elements.sectionMenu.classList.add('show'); elements.sectionBtn.setAttribute('aria-expanded','true'); }
  };
  elements.typeBtn.onclick = event => {
    event.stopPropagation();
    const shouldOpen = !elements.typeMenu.classList.contains('show');
    closeMenus();
    if (shouldOpen) { elements.typeMenu.classList.add('show'); elements.typeBtn.setAttribute('aria-expanded','true'); }
  };
  $$('#sectionMenu [data-section]').forEach(button => button.onclick = event => {
    event.stopPropagation(); currentSection = button.dataset.section; syncFilters(); closeMenus(); renderHome();
  });
  $$('#typeMenu [data-type]').forEach(button => button.onclick = event => {
    event.stopPropagation(); currentType = button.dataset.type; syncFilters(); closeMenus(); renderHome();
  });
  document.addEventListener('click', closeMenus);

  $('#openProfile').onclick = () => { elements.overlay.classList.add('show'); elements.drawer.classList.add('show'); };
  const hideDrawer = () => { elements.overlay.classList.remove('show'); elements.drawer.classList.remove('show'); };
  $('#closeDrawer').onclick = hideDrawer;
  elements.overlay.onclick = hideDrawer;
  $$('.lang-option').forEach(button => button.onclick = () => {
    state.language = button.textContent.trim(); saveState();
    $$('.lang-option').forEach(option => option.classList.toggle('active', option === button));
    showToast(`${state.language} selected for this demo`);
  });
  $('#accountSettings').onclick = () => showToast('Kristijan · Waiter · Demo profile');
  $('#sectionSettings').onclick = () => showToast(`Access: ${currentSection}`);
  $('#mockLogout').onclick = () => { hideDrawer(); showToast('Demo session stays signed in'); };
  $('#resetDemo').onclick = () => {
    if (!window.confirm('Reset all mock orders and bill requests?')) return;
    state = seedState(); saveState(); currentSection = 'Terrace'; currentType = 'pending';
    syncFilters(); hideDrawer(); renderAll(); showView('home'); showToast('Demo data restored');
  };

  navItems.forEach(item => item.onclick = () => {
    const index = Number(item.dataset.navIndex);
    if (index === 0) showView('home');
    if (index === 1) showView('search');
    if (index === 2) openBuilder();
    if (index === 3) showView('mine');
    if (index === 4) openBills();
  });

  elements.searchInput.addEventListener('input', renderSearch);
  $('#billClose').onclick = closeBills;
  elements.billOverlay.onclick = closeBills;
  $('#detailClose').onclick = closeDetail;
  elements.detailOverlay.onclick = closeDetail;
  $('#builderClose').onclick = closeBuilder;
  elements.submitOrder.onclick = submitNewOrder;
  elements.categoryTabs.onclick = event => {
    const button = event.target.closest('[data-category]');
    if (!button) return; activeCategory = button.dataset.category; renderBuilder();
  };
  elements.menuList.onclick = event => {
    const button = event.target.closest('[data-cart]');
    if (!button) return;
    const itemId = button.dataset.item;
    const delta = button.dataset.cart === 'increase' ? 1 : -1;
    cart[itemId] = Math.max(0,(cart[itemId] || 0) + delta);
    if (!cart[itemId]) delete cart[itemId];
    renderBuilder();
  };

  document.addEventListener('click', event => {
    const orderButton = event.target.closest('[data-open-order]');
    if (orderButton) openOrderDetail(orderButton.dataset.openOrder);
    const actionButton = event.target.closest('[data-order-action]');
    if (actionButton) runOrderAction(actionButton.dataset.orderId, actionButton.dataset.orderAction);
    const billButton = event.target.closest('[data-bill-open]');
    if (billButton) { closeBills(); openBillDetail(billButton.dataset.billOpen); }
    const payButton = event.target.closest('[data-pay-bill]');
    if (payButton) {
      const bill = state.bills.find(candidate => candidate.id === payButton.dataset.payBill);
      if (bill) { bill.status = 'paid'; bill.paidAt = Date.now(); saveState(); closeDetail(); renderBills(); showToast(`Table ${bill.table} marked as paid`); }
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (elements.orderBuilder.classList.contains('show')) closeBuilder();
    else if (elements.detailSheet.classList.contains('show')) closeDetail();
    else if (elements.billPanel.classList.contains('show')) closeBills();
    else hideDrawer();
  });

  populateTables();
  syncFilters();
  $$('.lang-option').forEach(button => button.classList.toggle('active', button.textContent.trim() === state.language));
  renderAll();
  showView('home');
  window.setInterval(renderAll, 60000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>

</body>
</html>
