name: Build QR Waiter TWA APK

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/build-qr-waiter-twa.yml
      - .well-known/assetlinks.json
  workflow_dispatch:
    inputs:
      version_code:
        description: Android version code
        required: true
        default: "1"
      version_name:
        description: Android version name
        required: true
        default: "1.0-test"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          QR_WAITER_KEYSTORE_BASE64: ${{ secrets.QR_WAITER_KEYSTORE_BASE64 }}
          QR_WAITER_KEY_PASSWORD: ${{ secrets.QR_WAITER_KEY_PASSWORD }}
        run: |
          if [[ -z "$QR_WAITER_KEYSTORE_BASE64" || -z "$QR_WAITER_KEY_PASSWORD" ]]; then
            echo "QR Waiter signing secrets are missing."
            exit 1
          fi

      - name: Create Android TWA project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/kristijanpoposki/qrwaitertest
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          cp qr-waiter-test/icon-512.png app/src/main/res/drawable/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QRWaiterTWA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kristijanpoposki.qrwaitertest'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.kristijanpoposki.qrwaitertest'
                  minSdk 23
                  targetSdk 35
                  versionCode Integer.parseInt(System.getenv('QR_WAITER_VERSION_CODE') ?: '1')
                  versionName System.getenv('QR_WAITER_VERSION_NAME') ?: '1.0-test'
              }

              signingConfigs {
                  testRelease {
                      storeFile file('../qrwaiter-test.p12')
                      storePassword System.getenv('QR_WAITER_KEY_PASSWORD')
                      keyAlias 'qrwaiter'
                      keyPassword System.getenv('QR_WAITER_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.testRelease
                  }
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.1'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="status_bar">#F4F8EE</color>
              <color name="navigation_bar">#FFFFFF</color>
              <color name="navigation_bar_divider">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">QR Waiter Test</string>
              <string name="launch_url">https://kristijanpoposki.github.io/qr-waiter-test/?source=twa</string>
              <string name="asset_statements" translatable="false">[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://kristijanpoposki.github.io"}}]</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LauncherActivityTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:statusBarColor">@color/status_bar</item>
                  <item name="android:navigationBarColor">@color/navigation_bar</item>
                  <item name="android:navigationBarDividerColor">@color/navigation_bar_divider</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/kristijanpoposki/qrwaitertest/LauncherActivity.java <<'EOF'
          package com.kristijanpoposki.qrwaitertest;

          import android.os.Build;
          import android.view.WindowManager;

          import androidx.browser.trusted.TrustedWebActivityDisplayMode;

          public final class LauncherActivity
                  extends com.google.androidbrowserhelper.trusted.LauncherActivity {
              @Override
              protected TrustedWebActivityDisplayMode getDisplayMode() {
                  final int cutoutMode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.R
                          ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;

                  return new TrustedWebActivityDisplayMode.ImmersiveMode(true, cutoutMode);
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/LauncherActivityTheme">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name=".LauncherActivity"
                      android:alwaysRetainTaskState="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:theme="@style/LauncherActivityTheme">

                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="@string/launch_url" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/status_bar" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR_DARK"
                          android:resource="@color/status_bar" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/navigation_bar" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR_DARK"
                          android:resource="@color/navigation_bar" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="kristijanpoposki.github.io"
                              android:pathPrefix="/qr-waiter-test/" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Decode signing key
        shell: bash
        env:
          QR_WAITER_KEYSTORE_BASE64: ${{ secrets.QR_WAITER_KEYSTORE_BASE64 }}
        run: printf '%s' "$QR_WAITER_KEYSTORE_BASE64" | base64 --decode > qrwaiter-test.p12

      - name: Verify Digital Asset Links
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 \
            https://kristijanpoposki.github.io/.well-known/assetlinks.json \
            | grep --fixed-strings 'com.kristijanpoposki.qrwaitertest'

      - name: Build signed test APK
        env:
          QR_WAITER_KEY_PASSWORD: ${{ secrets.QR_WAITER_KEY_PASSWORD }}
          QR_WAITER_VERSION_CODE: ${{ inputs.version_code }}
          QR_WAITER_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep --fixed-strings "package: name='com.kristijanpoposki.qrwaitertest'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-waiter-twa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
