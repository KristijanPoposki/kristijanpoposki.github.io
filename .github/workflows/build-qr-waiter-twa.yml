name: Build QR Waiter Fullscreen APK

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/build-qr-waiter-twa.yml
      - .well-known/assetlinks.json
  workflow_dispatch:
    inputs:
      version_code:
        description: Android version code
        required: true
        default: "4"
      version_name:
        description: Android version name
        required: true
        default: "1.3-test"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          QR_WAITER_KEYSTORE_BASE64: ${{ secrets.QR_WAITER_KEYSTORE_BASE64 }}
          QR_WAITER_KEY_PASSWORD: ${{ secrets.QR_WAITER_KEY_PASSWORD }}
        run: |
          if [[ -z "$QR_WAITER_KEYSTORE_BASE64" || -z "$QR_WAITER_KEY_PASSWORD" ]]; then
            echo "QR Waiter signing secrets are missing."
            exit 1
          fi

      - name: Create fullscreen Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/kristijanpoposki/qrwaitertest
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          cp qr-waiter-test/icon-512.png app/src/main/res/drawable/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QRWaiterTWA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kristijanpoposki.qrwaitertest'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.kristijanpoposki.qrwaitertest'
                  minSdk 23
                  targetSdk 35
                  versionCode Integer.parseInt(System.getenv('QR_WAITER_VERSION_CODE') ?: '4')
                  versionName System.getenv('QR_WAITER_VERSION_NAME') ?: '1.3-test'
              }

              signingConfigs {
                  testRelease {
                      storeFile file('../qrwaiter-test.p12')
                      storePassword System.getenv('QR_WAITER_KEY_PASSWORD')
                      keyAlias 'qrwaiter'
                      keyPassword System.getenv('QR_WAITER_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.testRelease
                  }
              }
          }

          dependencies {}
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_background">#F4F8EE</color>
              <color name="status_bar">#F4F8EE</color>
              <color name="navigation_bar">#FFFFFF</color>
              <color name="navigation_bar_divider">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">QR Waiter Fullscreen v4</string>
              <string name="launch_url">https://kristijanpoposki.github.io/qr-waiter-test/?source=android&amp;wrapper=4</string>
              <string name="asset_statements" translatable="false">[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://kristijanpoposki.github.io"}}]</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LauncherActivityTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowIsTranslucent">false</item>
                  <item name="android:windowBackground">@color/app_background</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@color/navigation_bar</item>
                  <item name="android:navigationBarDividerColor">@color/navigation_bar_divider</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowDisablePreview">false</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/kristijanpoposki/qrwaitertest/LauncherActivity.java <<'EOF'
          package com.kristijanpoposki.qrwaitertest;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class LauncherActivity extends Activity {
              private static final String APP_HOST = "kristijanpoposki.github.io";
              private static final String APP_URL =
                      "https://kristijanpoposki.github.io/qr-waiter-test/?source=android&wrapper=4";

              private final Handler fullscreenHandler = new Handler(Looper.getMainLooper());
              private final Runnable fullscreenRunnable = this::hideSystemBars;
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureWindow();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(244, 248, 238));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("https".equalsIgnoreCase(uri.getScheme())
                                  && APP_HOST.equalsIgnoreCase(uri.getHost())) {
                              return false;
                          }

                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          scheduleFullscreen();
                          installDiagnosticBadge(view);
                      }
                  });

                  setContentView(webView);
                  installInsetsControlListener();
                  scheduleFullscreen();
                  webView.loadUrl(APP_URL);
              }

              private void installDiagnosticBadge(WebView view) {
                  view.evaluateJavascript(
                          "(function(){"
                                  + "var old=document.getElementById('native-v4-badge');"
                                  + "if(old)old.remove();"
                                  + "var badge=document.createElement('div');"
                                  + "badge.id='native-v4-badge';"
                                  + "badge.style.cssText='position:fixed;top:4px;right:4px;z-index:2147483647;"
                                  + "padding:5px 7px;border-radius:8px;background:#111;color:#fff;"
                                  + "font:700 10px/1.25 sans-serif;pointer-events:none;white-space:pre;';"
                                  + "function update(){var vv=window.visualViewport;"
                                  + "badge.textContent='NATIVE V4\\ninner '+innerWidth+'x'+innerHeight"
                                  + "+(vv?' | vv '+Math.round(vv.width)+'x'+Math.round(vv.height):'');}"
                                  + "document.body.appendChild(badge);update();"
                                  + "window.addEventListener('resize',update);"
                                  + "if(window.visualViewport)visualViewport.addEventListener('resize',update);"
                                  + "})();",
                          null);
              }

              private void configureWindow() {
                  Window window = getWindow();
                  window.clearFlags(WindowManager.LayoutParams.FLAG_FORCE_NOT_FULLSCREEN);
                  window.addFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                                  | WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.WHITE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setStatusBarContrastEnforced(false);
                      window.setNavigationBarContrastEnforced(false);
                  }

                  WindowManager.LayoutParams attributes = window.getAttributes();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      attributes.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      attributes.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  window.setAttributes(attributes);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                  }

                  applyLegacyFullscreenFlags();
                  hideSystemBars();
              }

              private void installInsetsControlListener() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller =
                              getWindow().getDecorView().getWindowInsetsController();
                      if (controller != null) {
                          controller.addOnControllableInsetsChangedListener(
                                  (insetsController, controllableTypes) -> {
                                      if ((controllableTypes & WindowInsets.Type.systemBars()) != 0) {
                                          applyModernFullscreen(insetsController);
                                      }
                                  });
                      } else {
                          getWindow().getDecorView().post(this::installInsetsControlListener);
                      }
                  }
              }

              private void scheduleFullscreen() {
                  fullscreenHandler.removeCallbacks(fullscreenRunnable);
                  fullscreenHandler.post(fullscreenRunnable);
                  fullscreenHandler.postDelayed(fullscreenRunnable, 50);
                  fullscreenHandler.postDelayed(fullscreenRunnable, 250);
                  fullscreenHandler.postDelayed(fullscreenRunnable, 750);
              }

              private void hideSystemBars() {
                  Window window = getWindow();
                  View decor = window.getDecorView();

                  applyLegacyFullscreenFlags();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = decor.getWindowInsetsController();
                      if (controller != null) {
                          applyModernFullscreen(controller);
                      }
                      return;
                  }
              }

              private void applyLegacyFullscreenFlags() {
                  int fullscreenFlags =
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LOW_PROFILE;

                  getWindow().getDecorView().setSystemUiVisibility(fullscreenFlags);
                  if (webView != null) webView.setSystemUiVisibility(fullscreenFlags);
              }

              private void applyModernFullscreen(WindowInsetsController controller) {
                  controller.setSystemBarsBehavior(
                          WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  controller.setSystemBarsAppearance(
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                                  | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS,
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                                  | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS);
                  controller.hide(WindowInsets.Type.systemBars());
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  scheduleFullscreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) scheduleFullscreen();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  fullscreenHandler.removeCallbacksAndMessages(null);
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:enableOnBackInvokedCallback="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/LauncherActivityTheme"
                  android:usesCleartextTraffic="false">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name=".LauncherActivity"
                      android:alwaysRetainTaskState="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:immersive="true"
                      android:label="@string/app_name"
                      android:theme="@style/LauncherActivityTheme"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="kristijanpoposki.github.io"
                              android:pathPrefix="/qr-waiter-test/" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Decode signing key
        shell: bash
        env:
          QR_WAITER_KEYSTORE_BASE64: ${{ secrets.QR_WAITER_KEYSTORE_BASE64 }}
        run: printf '%s' "$QR_WAITER_KEYSTORE_BASE64" | base64 --decode > qrwaiter-test.p12

      - name: Verify Digital Asset Links
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 \
            https://kristijanpoposki.github.io/.well-known/assetlinks.json \
            | grep --fixed-strings 'com.kristijanpoposki.qrwaitertest'

      - name: Build signed test APK
        env:
          QR_WAITER_KEY_PASSWORD: ${{ secrets.QR_WAITER_KEY_PASSWORD }}
          QR_WAITER_VERSION_CODE: ${{ inputs.version_code }}
          QR_WAITER_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep --fixed-strings "package: name='com.kristijanpoposki.qrwaitertest'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-waiter-fullscreen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
