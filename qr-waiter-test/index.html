<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F1F2EF" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>QR Waiter Test</title>
  <style>
    :root {
      --bg: #f4f4f1;
      --surface: #ffffff;
      --surface-2: #f8f8f6;
      --text: #121212;
      --muted: #6d6d68;
      --line: #e4e4df;
      --line-strong: #d5d5cf;
      --brand: #111111;
      --brand-contrast: #ffffff;
      --pending-bg: #fff5d8;
      --pending-text: #6f4d00;
      --accepted-bg: #e8f7ee;
      --accepted-text: #17603a;
      --delivery-bg: #eaf1ff;
      --delivery-text: #244e96;
      --kds-bg: #f2ebff;
      --kds-text: #5a3790;
      --danger-bg: #fff0ee;
      --danger-text: #9d2d21;
      --shadow: 0 8px 28px rgba(18, 18, 18, 0.08);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; }

    html { background: #dddeda; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background: #dddeda;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    button, select, input { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      width: min(100%, 540px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 0 1px rgba(18,18,18,.03), 0 24px 80px rgba(18,18,18,.12);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(14px + env(safe-area-inset-top)) 16px 0;
      background: linear-gradient(var(--bg) 82%, rgba(244,244,241,0));
    }

    .restaurant-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 54px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .restaurant-name {
      margin: 0;
      font-size: 22px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -.035em;
    }

    .language-wrap {
      position: relative;
      justify-self: end;
    }

    .language-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 52px;
      height: 42px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.03);
      transition: background-color 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .language-toggle:hover { background: #f9f9f7; }
    .language-toggle:active { transform: scale(.97); }
    .language-toggle:focus-visible { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }
    .language-toggle svg { transition: transform 180ms ease; }
    .language-wrap.open .language-toggle svg { transform: rotate(180deg); }

    .language-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 45;
      width: 176px;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 14px 36px rgba(18,18,18,.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px) scale(.98);
      transform-origin: top right;
      transition: opacity 150ms ease, transform 180ms ease, visibility 150ms ease;
    }

    .language-wrap.open .language-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .language-option {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0 10px;
      background: transparent;
      display: grid;
      grid-template-columns: 31px 1fr auto;
      align-items: center;
      gap: 8px;
      text-align: left;
      cursor: pointer;
    }

    .language-option:hover { background: var(--surface-2); }
    .language-option:focus-visible { outline: 2px solid #111; outline-offset: -2px; }

    .language-code {
      display: grid;
      place-items: center;
      width: 31px;
      height: 28px;
      border-radius: 10px;
      background: #f1f1ed;
      font-size: 10px;
      font-weight: 900;
    }

    .language-name {
      min-width: 0;
      font-size: 12px;
      font-weight: 800;
    }

    .language-check {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      opacity: 0;
    }

    .language-option.active .language-check { opacity: 1; }

    .header-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 46px;
      gap: 8px;
      margin-top: 12px;
      max-height: 46px;
      opacity: 1;
      transform: translateY(0) scale(.999);
      transform-origin: right center;
      overflow: hidden;
      transition: max-height 220ms ease, opacity 160ms ease, transform 220ms cubic-bezier(.22,.9,.3,1), margin 220ms ease;
    }

    .section-select-wrap {
      position: relative;
      min-width: 0;
    }

    .search-toggle {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.025);
      transition: background-color 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .search-toggle:hover { background: #f9f9f7; }
    .search-toggle:active { transform: scale(.96); }
    .search-toggle:focus-visible { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }

    .search-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      transform: translateY(-4px) scaleX(.88);
      transform-origin: right center;
      overflow: hidden;
      pointer-events: none;
      transition: max-height 240ms ease, opacity 170ms ease, transform 260ms cubic-bezier(.22,.9,.3,1), margin 240ms ease;
    }

    .topbar.searching .header-tools {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      transform: translateY(-4px) scaleX(.88);
      pointer-events: none;
    }

    .topbar.searching .search-row {
      max-height: 46px;
      margin-top: 12px;
      opacity: 1;
      transform: translateY(0) scaleX(1);
      pointer-events: auto;
    }

    .search-back {
      width: 42px;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .search-back:focus-visible { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }

    .search-input-wrap {
      position: relative;
      min-width: 0;
      height: 46px;
    }

    .search-input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      outline: none;
      background: var(--surface);
      color: var(--text);
      padding: 0 42px 0 41px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.025);
    }

    .search-input::placeholder { color: #8a8a84; font-weight: 600; }
    .search-input:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }

    .search-input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #555550;
    }

    .search-clear {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, background-color 140ms ease;
    }

    .search-clear.visible { opacity: 1; pointer-events: auto; }
    .search-clear:hover { background: #efefeb; }

    .section-select {
      appearance: none;
      width: 100%;
      height: 46px;
      padding: 0 44px 0 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text);
      background: var(--surface);
      font-size: 14px;
      font-weight: 760;
      box-shadow: 0 2px 8px rgba(0,0,0,.025);
    }

    .section-select:focus-visible { border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }

    .select-icon, .chevron {
      pointer-events: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .select-icon { left: 13px; }
    .chevron { right: 14px; }

    /* Lightweight operational header */
    .restaurant-row {
      align-items: start;
      min-height: 66px;
      gap: 10px;
    }

    .restaurant-copy { min-width: 0; }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding-top: 1px;
    }

    .search-toggle.lightweight {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      box-shadow: none;
      color: #2f2f2c;
    }

    .search-toggle.lightweight:hover { background: rgba(17,17,17,.055); }
    .search-toggle.lightweight:focus-visible { border: 0; box-shadow: 0 0 0 3px rgba(17,17,17,.10); }

    .language-toggle {
      min-width: 48px;
      height: 40px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      box-shadow: none;
      padding: 0 7px;
    }

    .language-toggle:hover { background: rgba(17,17,17,.055); }

    .section-menu-wrap {
      position: relative;
      width: max-content;
      max-width: 100%;
      margin-top: 6px;
    }

    .section-trigger {
      max-width: 100%;
      min-height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 760;
      cursor: pointer;
      text-align: left;
    }

    .section-trigger:hover { color: var(--text); }
    .section-trigger:focus-visible { outline: 2px solid rgba(17,17,17,.18); outline-offset: 4px; border-radius: 8px; }
    .section-trigger svg { flex: 0 0 auto; transition: transform 180ms ease; }
    .section-menu-wrap.open .section-trigger svg { transform: rotate(180deg); }

    .section-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 46;
      width: 228px;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 16px 40px rgba(18,18,18,.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px) scale(.98);
      transform-origin: top left;
      transition: opacity 150ms ease, transform 180ms ease, visibility 150ms ease;
    }

    .section-menu-wrap.open .section-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .section-option {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0 10px;
      background: transparent;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 18px;
      align-items: center;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .section-option:hover { background: var(--surface-2); }
    .section-option > span:first-child { font-size: 13px; font-weight: 820; }
    .section-option small { color: var(--muted); font-size: 11px; font-weight: 700; }
    .section-check { opacity: 0; font-size: 14px; font-weight: 900; }
    .section-option.active .section-check { opacity: 1; }

    .section-select-native {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .topbar.searching .restaurant-row {
      max-height: 0;
      min-height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(-4px);
      transition: max-height 210ms ease, opacity 150ms ease, transform 210ms ease;
    }

    .restaurant-row {
      max-height: 90px;
      opacity: 1;
      transform: translateY(0);
      transition: max-height 210ms ease, opacity 150ms ease, transform 210ms ease;
    }

    .topbar.searching .search-row {
      max-height: 46px;
      margin-top: 0;
    }

    .search-row { margin-top: 0; }

    .state-nav-wrap {
      margin: 14px 0 0;
      display: flex;
      justify-content: center;
      padding-bottom: 10px;
    }

    .state-nav {
      --active-index: 0;
      position: relative;
      width: min(100%, 430px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      padding: 3px;
      border: 1px solid #deded9;
      border-radius: 19px;
      background: #ecece8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 1px 2px rgba(0,0,0,.03);
      overflow: hidden;
    }

    .state-slider {
      position: absolute;
      z-index: 0;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 4);
      border-radius: 20px;
      background: var(--brand);
      box-shadow: 0 2px 7px rgba(0,0,0,.16);
      transform: translateX(calc(var(--active-index) * 100%));
      transition: transform 280ms cubic-bezier(.22,.9,.3,1);
      pointer-events: none;
    }

    .state-tab {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 38px;
      border: 0;
      border-radius: 20px;
      padding: 0 5px;
      background: transparent;
      color: #666660;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 820;
      letter-spacing: -.01em;
      cursor: pointer;
      white-space: nowrap;
      transition: color 180ms ease;
    }

    .state-tab .count {
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(17,17,17,.07);
      color: #666660;
      font-size: 10px;
      font-weight: 880;
      transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .state-tab.active { color: var(--brand-contrast); }

    .state-tab.active .count {
      background: #fff;
      color: #111;
      transform: scale(1.02);
    }

    .state-tab:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -4px;
    }

    @media (max-width: 350px) {
      .state-tab { gap: 3px; font-size: 14px; padding: 0 2px; }
      .state-tab .count { min-width: 17px; height: 17px; padding: 0 4px; font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .state-slider, .restaurant-row, .search-row, .search-toggle, .search-clear, .section-menu, .section-trigger svg { transition: none; }
    }

    main { padding: 8px 14px 116px; }

    .queue-meta {
      min-height: 34px;
      margin: 2px 2px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .queue-title { color: var(--text); font-size: 14px; font-weight: 850; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2f8d58;
      box-shadow: 0 0 0 4px rgba(47,141,88,.10);
    }

    .order-list { display: grid; gap: 9px; }

    .order-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(18,18,18,.035);
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .order-card:active { transform: scale(.995); }

    .card-main {
      width: 100%;
      padding: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .card-main:focus-visible { outline: 3px solid rgba(17,17,17,.16); outline-offset: -3px; border-radius: var(--radius-lg); }

    .card-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .table-badge {
      min-width: 66px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d7d7d1;
      border-radius: 21px;
      background: #f7f7f4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .table-badge.delivery-table { min-width: 82px; font-size: 12px; }

    .order-id { min-width: 0; }
    .order-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .order-title-row strong { font-size: 13px; font-weight: 850; white-space: nowrap; }
    .order-id > span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .order-title-row .status-badge { min-height: 22px; padding: 0 8px; font-size: 9px; }

    .age {
      align-self: start;
      min-width: 49px;
      height: 28px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 18px;
      background: var(--surface-2);
      color: #565652;
      font-size: 11px;
      font-weight: 850;
    }

    .age.urgent { background: var(--danger-bg); color: var(--danger-text); }

    .card-content {
      margin-top: 10px;
      padding-left: 2px;
      display: grid;
      gap: 5px;
    }

    .item-line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      column-gap: 7px;
      min-width: 0;
      font-size: 13px;
      line-height: 1.25;
    }

    .qty { font-weight: 900; }
    .item-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 690; }
    .item-note { color: var(--muted); font-size: 11px; }
    .more-line { color: var(--muted); font-size: 11px; font-weight: 700; }

    .card-bottom {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #eeeeea;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .status-badge {
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .02em;
    }

    .status-pending { background: var(--pending-bg); color: var(--pending-text); }
    .status-accepted { background: var(--accepted-bg); color: var(--accepted-text); }
    .status-delivery { background: var(--delivery-bg); color: var(--delivery-text); }
    .status-kds { background: var(--kds-bg); color: var(--kds-text); }

    .money { font-size: 13px; font-weight: 900; white-space: nowrap; }

    .card-actions {
      padding: 0 12px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn {
      min-height: 42px;
      border-radius: 20px;
      border: 1px solid var(--line-strong);
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
    }

    .btn-primary { border-color: #111; background: #111; color: #fff; }

    .btn-accept {
      width: auto;
      min-width: 118px;
      min-height: 40px;
      padding: 0 15px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -.015em;
    }

    .card-actions.pending-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .card-actions.pending-actions .btn-secondary {
      width: 42px;
      padding: 0;
      flex: 0 0 42px;
    }
    .btn-secondary { background: #fff; color: #111; }
    .btn-quiet { background: #f6f6f3; color: #111; }
    .btn-danger { border-color: #ebc6c1; background: #fff7f6; color: #9d2d21; }
    .btn:focus-visible { outline: 3px solid rgba(17,17,17,.15); outline-offset: 2px; }

    .empty-state {
      padding: 56px 28px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 21px;
      display: grid; place-items: center; background: #e9e9e5; color: #5c5c57;
    }

    /* V16 requested clarity refinements */

    /* Remove the special urgency stripe/left border from all order cards. */
    .order-card.order-attention,
    .order-card.order-overdue {
      border-left-width: 1px !important;
      border-left-color: #DBE1D8 !important;
    }

    /* Section is now the main header title. */
    .restaurant-row {
      min-height: 52px;
      align-items: center;
    }

    .restaurant-copy {
      display: flex;
      align-items: center;
      min-height: 48px;
    }

    .section-menu-wrap {
      margin-top: 0;
      display: flex;
      align-items: center;
    }

    .section-trigger {
      min-height: 48px;
      padding: 0;
      font-size: 22px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -.03em;
      color: #20241e;
      gap: 7px;
    }

    .section-trigger svg {
      width: 17px;
      height: 17px;
    }

    /* Stronger bottom-nav readability for the two primary destinations. */
    .nav-btn {
      font-size: 13px;
      font-weight: 700;
      gap: 4px;
    }

    .nav-btn svg {
      width: 27px;
      height: 27px;
      stroke-width: 2;
    }

    /* Time and total should read as neutral black information. */
    .age,
    .age-attention,
    .age-overdue {
      color: #111111 !important;
    }

    .money,
    .order-id strong {
      color: #111111 !important;
    }

    .line-count {
      color: #111111;
      font-size: 13px;
      font-weight: 700;
    }

    /* Restored explicit order-details affordance. */
    .pending-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .pending-actions .btn-more {
      width: 48px;
      min-width: 48px;
      padding: 0;
      flex: 0 0 48px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
    }

  
    /* V17 — unified numeric sizing + uploaded round-table icon */

    /* Bottom navigation typography: New order matches Home / My Orders. */
    .create-label {
      font-size: 13px;
      font-weight: 700;
    }

    /* One consistent numeric size throughout collapsed order cards. */
    .order-card .order-id strong,
    .order-card .table-badge:not(.delivery-table) > span,
    .order-card .age,
    .order-card .qty,
    .order-card .item-price,
    .order-card .money {
      font-size: 16px !important;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    /* Keep regular card numbers visually consistent rather than over-bold. */
    .order-card .order-id strong,
    .order-card .table-badge:not(.delivery-table) > span,
    .order-card .age,
    .order-card .qty,
    .order-card .item-price {
      font-weight: 600 !important;
    }

    /* Total value receives only a slight emphasis. */
    .order-card .money {
      font-weight: 700 !important;
      color: #111111 !important;
    }

    /* Uploaded table SVG should visually match the 16px table number. */
    .order-card .table-badge:not(.delivery-table) svg {
      width: 16px !important;
      height: 16px !important;
      flex: 0 0 16px;
      display: block;
    }

    .order-card .table-badge:not(.delivery-table) {
      gap: 5px;
    }

    @media (max-width: 350px) {
      .create-label {
        font-size: 13px;
      }

      .order-card .order-id strong,
      .order-card .table-badge:not(.delivery-table) > span,
      .order-card .age,
      .order-card .qty,
      .order-card .item-price,
      .order-card .money {
        font-size: 16px !important;
      }
    }

  
    /* V18 refinements */

    /* Dropdowns must sit above the sticky header, cards, and sheets trigger layer. */
    .topbar,
    .restaurant-row,
    .header-actions,
    .section-menu-wrap,
    .language-menu-wrap {
      position: relative;
      z-index: 60;
      overflow: visible !important;
