352-.0555 2.6419.1103 3.9196.5036C14.0087 16.6931 12.7025 16.5232 11.4247 16.1319zM24.2603 9.7133c1.3352-.0555 2.6419.1103 3.9196.5036C26.8443 10.2745 25.538 10.1045 24.2603 9.7133zM25.9906 13.086c1.3352-.0555 2.642.1103 3.9196.5036C28.5746 13.6472 27.2684 13.4772 25.9906 13.086zM31.9677 10.2169c1.3352-.0555 2.642.1103 3.9196.5036C34.5519 10.7781 33.2455 10.6081 31.9677 10.2169zM13.974 10.774c2.1169-.0566 4.216.1092 6.2968.5036C18.1538 11.3364 16.0549 11.1664 13.974 10.774zM20.5915 16.6355c1.3352-.0554 2.642.1104 3.9196.5036C23.1756 17.1968 21.8694 17.0269 20.5915 16.6355zM10.0083 11.036c1.3352-.0554 2.642.1104 3.9196.5036C12.5924 11.5973 11.2862 11.4273 10.0083 11.036zM37.75 14.0616c1.3352-.0554 2.642.1104 3.9196.5037C40.334 14.6229 39.0278 14.453 37.75 14.0616z"></path><path fill="#444445" d="M25.0001,38.9047c-6.9538,0-12.5908-1.5033-12.5908-3.3575v2.6921c0,1.8543,5.637,3.3575,12.5908,3.3575    c6.9537,0,12.5908-1.5033,12.5908-3.3575v-2.6921C37.5908,37.4015,31.9537,38.9047,25.0001,38.9047z"></path></svg>`;
    const svgBike = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h4l2-6h3M9 8h4l2 3M7 12h4"/></svg>`;
    const svgChef = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 10a4 4 0 0 1 1-7 5 5 0 0 1 9 0 4 4 0 0 1 2 7v9H6z"/><path d="M6 14h12M9 19v-2M15 19v-2"/></svg>`;

    function money(value) { return `${value.toLocaleString('en-US')} ден`; }

    function displayOrderNumber(id) {
      return String(id).replace(/^[A-Za-z]+-?/, '');
    }

    function sectionLabel(value) {
      return { all: 'All sections', terrace: 'Terrace', inside: 'Inside', garden: 'Garden' }[value] || value;
    }

    function sectionTriggerText(value) {
      return { all: 'All sections', terrace: 'Terrace', inside: 'Inside', garden: 'Garden' }[value] || value;
    }

    function closeSectionMenu() {
      sectionMenuWrap.classList.remove('open');
      sectionTrigger.setAttribute('aria-expanded', 'false');
    }

    function closeMyOrdersViewMenu() {
      if (!myOrdersViewMenu || !myOrdersViewTrigger) return;
      myOrdersViewMenu.hidden = true;
      myOrdersViewTrigger.setAttribute('aria-expanded', 'false');
      myOrdersViewTrigger.classList.remove('open');
    }

    function syncMyOrdersViewFilter() {
      if (!myOrdersViewTrigger) return;

      myOrdersViewTrigger.dataset.view = myOrdersViewMode;
      const label = myOrdersViewMode === 'compact' ? 'Compact' : 'Detailed';
      myOrdersViewTrigger.setAttribute('aria-label', `Change My Orders view. Current view: ${label}`);

      myOrdersViewOptions.forEach(option => {
        const selected = option.dataset.myordersView === myOrdersViewMode;
        option.classList.toggle('active', selected);
        option.setAttribute('aria-checked', String(selected));
        const check = option.querySelector('.view-check');
        if (check) check.textContent = selected ? '✓' : '';
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function statusInfo(state) {
      return {
        pending: ['Pending', 'status-pending'],
        accepted: ['Accepted', 'status-accepted'],
        delivery: ['Delivery', 'status-delivery'],
        kds: ['KDS', 'status-kds']
      }[state];
    }

    function currentAge(order) {
      return Math.max(0, Math.floor((Date.now() - order.createdAt) / 60_000));
    }

    function ageMeta(age) {
      if (age >= 8) return { cls: 'age-attention', card: 'order-attention', label: `${age} min` };
      return { cls: 'age-calm', card: '', label: `${age} min` };
    }

    function isAllergenNote(note) {
      return /\b(nut|nuts|allerg|gluten|peanut|shellfish|sesame|dairy|lactose)\b/i.test(note || '');
    }

    function visibleCardItems(order, limit) {
      const noted = order.items.filter(item => item.note);
      const plain = order.items.filter(item => !item.note);
      const take = Math.max(limit, noted.length);
      const selected = [...noted, ...plain].slice(0, take);
      return { selected, hiddenCount: Math.max(0, order.items.length - selected.length) };
    }

    function updateSearchChip() {
      const visible = Boolean(searchQuery) && !topbar.classList.contains('searching');
      activeSearchChip.hidden = !visible;
      activeSearchText.textContent = visible ? `Search: “${searchQuery}”` : '';
    }

    function updateSectionAvailability() {
      const disabled = activeState === 'delivery' && !searchQuery;
      sectionTrigger.disabled = disabled;
      sectionTrigger.classList.toggle('is-disabled', disabled);
      sectionTriggerLabel.textContent = disabled ? 'Delivery' : sectionTriggerText(sectionSelect.value);
      if (disabled) closeSectionMenu();
    }

    function refreshAgeBadges() {
      document.querySelectorAll('[data-age-id]').forEach(node => {
        const order = orders.find(o => o.id === node.dataset.ageId);
        if (!order) return;
        const meta = ageMeta(currentAge(order));
        node.className = `age ${meta.cls}`;
        node.textContent = meta.label;
        const card = node.closest('.order-card');
        if (card) {
          card.classList.toggle('order-attention', meta.card === 'order-attention');
          card.classList.remove('order-overdue');
        }
      });
    }

    function matchesSearch(order) {
      const query = searchQuery.trim().toLowerCase();
      if (!query) return true;
      const searchable = [
        order.id,
        order.table != null ? `table ${order.table}` : '',
        order.table != null ? String(order.table) : '',
        order.waiter,
        order.fulfillment || '',
        order.phone || '',
        sectionLabel(order.section),
        ...order.items.flatMap(item => [item.name, item.note || ''])
      ].join(' ').toLowerCase();
      return searchable.includes(query);
    }

    function visibleOrders() {
      const selected = sectionSelect.value;
      return orders
        .filter(order => {
          if (order.state !== activeState) return false;
          if (activeState === 'delivery' && order.deliveryAccepted) return false;
          if (activeState !== 'delivery' && selected !== 'all' && order.section !== selected) return false;
          return true;
        })
        .sort((a, b) => currentAge(b) - currentAge(a));
    }

    function renderGlobalSearch() {
      const results = orders.filter(matchesSearch).sort((a, b) => currentAge(b) - currentAge(a));
      const states = ['pending', 'accepted', 'delivery', 'kds'];
      const groups = states.map(state => {
        const group = results.filter(order => order.state === state);
        if (!group.length) return '';
        return `<section class="search-group">
          <div class="search-group-head"><span>${statusInfo(state)[0]}</span><small>${group.length} result${group.length === 1 ? '' : 's'}</small></div>
          <div class="order-list">${group.map(o => cardMarkup(o)).join('')}</div>
        </section>`;
      }).join('');
      main.innerHTML = results.length ? `<div class="search-results-title"><strong>Search results</strong><span>All states · all sections</span></div>${groups}` : `<div class="order-list">${emptyMarkup('No matching orders', `Nothing matches “${escapeHtml(searchQuery)}”.`)}</div>`;
      bindCardActions();
    }

    function updateCounts() {
      // State counters are intentionally hidden in the navigation.
    }

    function cardMarkup(order, compactOwned = false) {
      const icon = order.state === 'delivery' ? svgBike : order.state === 'kds' ? svgChef : svgTable;
      const locationText = order.state === 'delivery' ? order.fulfillment : `${order.table}`;
      const badgeClass = order.state === 'delivery' ? 'table-badge delivery-table' : 'table-badge';
      const age = currentAge(order);
      const ageInfo = ageMeta(age);
      const visible = visibleCardItems(order, compactOwned ? 2 : 3);
      const itemLines = visible.selected.map(item => {
        const note = item.note ? `<span class="item-note">${escapeHtml(item.note)}</span>` : '';
        return `<div class="item-line"><span class="item-copy"><span class="item-main"><span class="item-name">${escapeHtml(item.name)}</span><span class="qty">${item.qty}x</span></span>${note}</span><span class="item-price">${money(item.price)}</span></div>`;
      }).join('');
      const more = visible.hiddenCount ? `<div class="more-line">+ ${visible.hiddenCount} more item${visible.hiddenCount === 1 ? '' : 's'}</div>` : '';

      let action = '';
      if (order.state === 'pending') action = `<div class="card-actions universal-actions"><button class="btn btn-primary btn-accept" data-accept="${order.id}">Accept</button></div>`;
      if (order.state === 'accepted') action = `<div class="card-actions universal-actions"><button class="btn btn-primary" data-bill="${order.id}">Bill</button></div>`;
      if (order.state === 'delivery') {
        const callButton = `<button class="btn btn-secondary btn-call" data-call="${order.phone}" aria-label="Call customer at ${order.phone}">Call</button>`;
        if (currentView === 'myOrders' || order.deliveryAccepted) {
          action = `<div class="card-actions universal-actions delivery-actions">${callButton}<button class="btn btn-primary" data-bill="${order.id}">Bill</button></div>`;
        } else {
          action = `<div class="card-actions universal-actions delivery-actions">${callButton}<button class="btn btn-primary btn-delivery-accept" data-delivery-accept="${order.id}">Accept</button></div>`;
        }
      }
      if (order.state === 'kds') {
        const kitchenStatus = order.kitchenReady ? 'Ready' : 'Preparing';
        action = `<div class="card-actions universal-actions"><span class="kitchen-status-label ${order.kitchenReady ? 'is-ready' : 'is-preparing'}">${kitchenStatus}</span></div>`;
      }

      return `<article class="order-card ${ageInfo.card}" data-card="${order.id}">
        <button class="card-main" data-open="${order.id}">
          <div class="card-top">
            <span class="${badgeClass}">${icon}<span>${escapeHtml(locationText)}</span></span>
            <span class="order-id"><strong>Order #${escapeHtml(displayOrderNumber(order.id))}</strong></span>
            <span class="age ${ageInfo.cls}" data-age-id="${order.id}">${ageInfo.label}</span>
          </div>
          <div class="card-content">${itemLines}${more}</div>
          <div class="card-bottom"><span class="line-count">Total:</span><span class="money">${money(order.total)}</span></div>
        </button>
        ${compactOwned ? '' : action}
      </article>`;
    }

    function acceptedTableTile(order) {
      return `<button class="accepted-table-tile" data-open="${order.id}" aria-label="Open accepted order for table ${order.table}">
        <span>${escapeHtml(String(order.table))}</span>
      </button>`;
    }

    function compactOwnedTile(order) {
      if (order.state === 'delivery') {
        return `<button class="accepted-table-tile compact-delivery-tile" data-open="${order.id}" aria-label="Open delivery order ${displayOrderNumber(order.id)}">
          <span class="compact-delivery-mark">D</span>
          <small>#${escapeHtml(displayOrderNumber(order.id))}</small>
        </button>`;
      }
      return acceptedTableTile(order);
    }

    function setOrderBuilderChrome(active) {
      appShell.classList.toggle('order-builder-mode', active);
      document.body.classList.toggle('order-builder-page', active);
      createOrderBtn.classList.toggle('active', active);
      if (active) createOrderBtn.setAttribute('aria-current', 'page');
      else createOrderBtn.removeAttribute('aria-current');
      draftDock.hidden = !active;
      if (!active && draftOrderScrim.classList.contains('open')) closeDraftOrder();
    }

    function renderHome() {
      currentView = 'home';
      setOrderBuilderChrome(false);
      if (myOrdersHeaderFilter) myOrdersHeaderFilter.hidden = true;
      closeMyOrdersViewMenu();
      appShell.classList.remove('my-orders-mode');
      homeNav.classList.add('active');
      myOrdersNav.classList.remove('active');
      document.querySelector('.state-nav-wrap').style.display = '';
      updateSearchChip();
      updateSectionAvailability();
      if (searchQuery) {
        renderGlobalSearch();
        return;
      }
      const list = visibleOrders();

      if (activeState === 'accepted') {
        main.innerHTML = list.length
          ? `<div class="accepted-table-grid">${list.map(acceptedTableTile).join('')}</div>`
          : emptyMarkup('No accepted tables', 'There are no accepted orders for the selected section.');
      } else {
        main.innerHTML = `<div class="order-list">${list.length ? list.map(o => cardMarkup(o)).join('') : emptyMarkup('No orders here', 'There are no orders in this state for the selected section.')}</div>`;
      }

      bindCardActions();
    }

    function renderMyOrders() {
      currentView = 'myOrders';
      setOrderBuilderChrome(false);
      if (myOrdersHeaderFilter) myOrdersHeaderFilter.hidden = false;
      syncMyOrdersViewFilter();
      homeNav.classList.remove('active');
      myOrdersNav.classList.add('active');
      document.querySelector('.state-nav-wrap').style.display = 'none';
      appShell.classList.add('my-orders-mode');
      sectionTriggerLabel.textContent = sectionTriggerText(sectionSelect.value);
      sectionTrigger.disabled = false;
      sectionTrigger.removeAttribute('aria-disabled');

      const mine = orders
        .filter(o =>
          o.waiter === 'Marko' &&
          (o.state === 'accepted' || (o.state === 'delivery' && o.deliveryAccepted)) &&
          matchesSearch(o)
        )
        .sort((a, b) => currentAge(b) - currentAge(a));

      const tableOrders = mine.filter(o => o.state === 'accepted');
      const deliveryOrders = mine.filter(o => o.state === 'delivery' && o.deliveryAccepted);

      syncMyOrdersViewFilter();

      let content = '';

      if (myOrdersViewMode === 'compact') {
        const compactTableGroup = `
          <section class="my-orders-group compact-orders-group table-orders-group">
            <div class="my-orders-group-title">
              <span>Table Orders</span>
              <span class="my-orders-group-count">${tableOrders.length}</span>
            </div>
            ${tableOrders.length
              ? `<div class="my-orders-compact-grid">${tableOrders.map(compactOwnedTile).join('')}</div>`
              : `<div class="my-orders-empty">No accepted table orders.</div>`}
          </section>`;

        const compactDeliveryGroup = deliveryOrders.length ? `
          <section class="my-orders-group compact-orders-group delivery-orders-group" aria-label="Accepted delivery orders">
            <div class="delivery-orders-divider" aria-hidden="true"></div>
            <div class="my-orders-group-title delivery-orders-title">
              <span>Delivery Orders</span>
              <span class="my-orders-group-count">${deliveryOrders.length}</span>
            </div>
            <div class="my-orders-compact-grid">
              ${deliveryOrders.map(compactOwnedTile).join('')}
            </div>
          </section>` : '';

        content = `${compactTableGroup}${compactDeliveryGroup}`;
      } else {
        const tableGroup = `
          <section class="my-orders-group table-orders-group">
            <div class="my-orders-group-title">
              <span>Table Orders</span>
              <span class="my-orders-group-count">${tableOrders.length}</span>
            </div>
            <div class="order-list">
              ${tableOrders.length
                ? tableOrders.map(o => cardMarkup(o, false)).join('')
                : `<div class="my-orders-empty">No accepted table orders.</div>`}
            </div>
          </section>`;

        const deliveryGroup = deliveryOrders.length ? `
          <section class="my-orders-group delivery-orders-group" aria-label="Accepted delivery orders">
            <div class="delivery-orders-divider" aria-hidden="true"></div>
            <div class="my-orders-group-title delivery-orders-title">
              <span>Delivery Orders</span>
              <span class="my-orders-group-count">${deliveryOrders.length}</span>
            </div>
            <div class="order-list">
              ${deliveryOrders.map(o => cardMarkup(o, false)).join('')}
            </div>
          </section>` : '';

        content = `${tableGroup}${deliveryGroup}`;
      }

      main.innerHTML = `
        <div class="my-orders-page my-orders-page-refined">
          ${content}
        </div>`;



      bindCardActions();
    }

    function draftEntries() {
      return menuCatalog
        .filter(item => (draftItems.get(item.id) || 0) > 0)
        .map(item => ({ ...item, qty: draftItems.get(item.id) }));
    }

    function draftItemCount() {
      return [...draftItems.values()].reduce((sum, qty) => sum + qty, 0);
    }

    function draftTotal() {
      return draftEntries().reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function menuTone(category) {
      return category.toLowerCase();
    }

    function menuItemMarkup(item) {
      const qty = draftItems.get(item.id) || 0;
      const control = qty
        ? `<div class="quantity-stepper" aria-label="Quantity for ${escapeHtml(item.name)}">
            <button class="quantity-btn" type="button" data-menu-adjust="${item.id}" data-delta="-1" aria-label="Remove one ${escapeHtml(item.name)}">−</button>
            <span class="quantity-value" aria-label="Quantity ${qty}">${qty}</span>
            <button class="quantity-btn" type="button" data-menu-adjust="${item.id}" data-delta="1" aria-label="Add one more ${escapeHtml(item.name)}">+</button>
          </div>`
        : `<button class="menu-add" type="button" data-menu-adjust="${item.id}" data-delta="1" aria-label="Add ${escapeHtml(item.name)}">Add</button>`;

      return `<article class="menu-item-card${qty ? ' is-added' : ''}">
        <span class="menu-item-mark" data-tone="${menuTone(item.category)}" aria-hidden="true">${escapeHtml(item.code)}</span>
        <div class="menu-item-copy">
          <h3>${escapeHtml(item.name)}</h3>
          <p>${escapeHtml(item.description)}</p>
          <span class="menu-item-price">${money(item.price)}</span>
        </div>
        ${control}
      </article>`;
    }

    function menuResultsMarkup() {
      const query = menuQuery.trim().toLowerCase();
      const matches = menuCatalog.filter(item => {
        const inCategory = menuCategory === 'All' || item.category === menuCategory;
        const searchable = `${item.name} ${item.description} ${item.category}`.toLowerCase();
        return inCategory && (!query || searchable.includes(query));
      });

      if (!matches.length) {
        return `<div class="menu-empty"><strong>No menu items found</strong><span>Try another search or category.</span></div>`;
      }

      const categories = menuCategory === 'All'
        ? menuCategories.slice(1).filter(category => matches.some(item => item.category === category))
        : [menuCategory];

      return categories.map(category => {
        const items = matches.filter(item => item.category === category);
        return `<section class="menu-section" aria-labelledby="menu-${category.toLowerCase()}">
          <div class="menu-section-head">
            <h2 id="menu-${category.toLowerCase()}">${escapeHtml(category)}</h2>
            <span>${items.length} item${items.length === 1 ? '' : 's'}</span>
          </div>
          <div class="menu-items">${items.map(menuItemMarkup).join('')}</div>
        </section>`;
      }).join('');
    }

    function renderMenuResults() {
      const results = document.getElementById('menuResults');
      if (results) results.innerHTML = menuResultsMarkup();
    }

    function renderDraftDock() {
      if (currentView !== 'newOrder') {
        draftDock.hidden = true;
        return;
      }

      const entries = draftEntries();
      const count = draftItemCount();
      const itemNames = entries.slice(0, 2).map(item => `${item.qty}× ${item.name}`).join(' · ');
      const moreCount = Math.max(0, entries.length - 2);
      const summary = count
        ? `${itemNames}${moreCount ? ` · +${moreCount} more` : ''}`
        : 'Tap Add beside a menu item';

      draftDock.hidden = false;
      draftDock.innerHTML = `
        <div class="draft-dock-summary">
          <span class="draft-count-badge">${count}</span>
          <div class="draft-dock-copy">
            <strong>${count ? `${count} item${count === 1 ? '' : 's'} · Table ${draftTable}` : 'Your order is empty'}</strong>
            <small>${escapeHtml(summary)}</small>
          </div>
        </div>
        <div class="draft-dock-action">
          <span class="draft-dock-total">${money(draftTotal())}</span>
          <button class="draft-dock-review" id="draftDockReview" type="button" ${count ? '' : 'disabled'}>Review</button>
        </div>`;

      document.getElementById('draftDockReview')?.addEventListener('click', openDraftOrder);
    }

    function adjustDraftItem(id, delta) {
      const item = menuCatalog.find(entry => entry.id === id);
      if (!item) return;
      const next = Math.max(0, Math.min(99, (draftItems.get(id) || 0) + delta));
      if (next) draftItems.set(id, next);
      else draftItems.delete(id);
      renderMenuResults();
      renderDraftDock();
      if (draftOrderScrim.classList.contains('open')) {
        if (draftItemCount()) renderDraftOrderSheet();
        else closeDraftOrder();
      }
    }

    function renderOrderBuilder() {
      if (!draftTable && !selectedTable) {
        openManual();
        return;
      }

      currentView = 'newOrder';
      setOrderBuilderChrome(true);
      appShell.classList.remove('my-orders-mode');
      if (myOrdersHeaderFilter) myOrdersHeaderFilter.hidden = true;
      closeMyOrdersViewMenu();
      homeNav.classList.remove('active');
      myOrdersNav.classList.remove('active');
      document.querySelector('.state-nav-wrap').style.display = 'none';
      topbar.classList.remove('searching');
      searchToggle.setAttribute('aria-expanded', 'false');
      activeSearchChip.hidden = true;
      sectionTrigger.disabled = false;
      sectionTrigger.classList.remove('is-disabled');
      sectionTriggerLabel.textContent = sectionTriggerText(sectionSelect.value);

      const guestMarkup = draftGuestName
        ? `<button class="builder-guest" id="editOrderContext" type="button" title="Edit table or guest" aria-label="Edit table or guest. Guest ${escapeHtml(draftGuestName)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"/></svg>
            ${escapeHtml(draftGuestName)}
          </button>`
        : '<button class="builder-guest" id="editOrderContext" type="button" aria-label="Edit table or guest">Edit table</button>';

      main.innerHTML = `<section class="order-builder" aria-labelledby="orderBuilderTitle">
        <div class="order-builder-head">
          <button class="builder-back" id="builderBack" type="button" aria-label="Back to orders">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="order-builder-title">
            <small>New order</small>
            <h1 id="orderBuilderTitle">Table ${draftTable}</h1>
          </div>
          ${guestMarkup}
        </div>

        <div class="menu-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input class="menu-search-input" id="menuSearch" type="search" inputmode="search" autocomplete="off" value="${escapeHtml(menuQuery)}" placeholder="Search the menu…" aria-label="Search menu items" />
          <button class="menu-search-clear" id="menuSearchClear" type="button" aria-label="Clear menu search" ${menuQuery ? '' : 'hidden'}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="menu-categories" id="menuCategories" aria-label="Menu categories">
          ${menuCategories.map(category => `<button class="menu-category${menuCategory === category ? ' active' : ''}" type="button" data-menu-category="${escapeHtml(category)}" aria-pressed="${menuCategory === category}">${escapeHtml(category)}</button>`).join('')}
        </div>

        <div id="menuResults">${menuResultsMarkup()}</div>
      </section>`;

      document.getElementById('builderBack').addEventListener('click', () => {
        renderHome();
        if (draftItemCount()) showToast('Draft kept for Table ' + draftTable);
      });
      document.getElementById('editOrderContext').addEventListener('click', () => {
        selectedTable = draftTable;
        document.getElementById('tableNumber').value = String(draftTable);
        document.getElementById('guestName').value = draftGuestName;
        openManual({ force: true });
      });

      const menuSearch = document.getElementById('menuSearch');
      const menuSearchClear = document.getElementById('menuSearchClear');
      menuSearch.addEventListener('input', () => {
        menuQuery = menuSearch.value;
        menuSearchClear.hidden = !menuQuery;
        renderMenuResults();
      });
      menuSearchClear.addEventListener('click', () => {
        menuQuery = '';
        menuSearch.value = '';
        menuSearchClear.hidden = true;
        renderMenuResults();
        menuSearch.focus();
      });

      document.getElementById('menuCategories').addEventListener('click', event => {
        const button = event.target.closest('[data-menu-category]');
        if (!button) return;
        menuCategory = button.dataset.menuCategory;
        document.querySelectorAll('[data-menu-category]').forEach(categoryButton => {
          const active = categoryButton === button;
          categoryButton.classList.toggle('active', active);
          categoryButton.setAttribute('aria-pressed', String(active));
        });
        renderMenuResults();
      });

      document.getElementById('menuResults').addEventListener('click', event => {
        const button = event.target.closest('[data-menu-adjust]');
        if (!button) return;
        adjustDraftItem(button.dataset.menuAdjust, Number(button.dataset.delta));
      });

      renderDraftDock();
    }

    function renderDraftOrderSheet() {
      const entries = draftEntries();
      const count = draftItemCount();
      draftOrderSheet.innerHTML = `
        <div class="grabber"></div>
        <div class="sheet-head">
          <div>
            <h2 id="draftOrderDialogTitle">Review order</h2>
            <p>Check quantities before sending.</p>
          </div>
          <button class="icon-btn" type="button" data-close="draft-order" aria-label="Close order review">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="draft-context">
          <strong>Table ${draftTable}</strong>
          <span>${count} item${count === 1 ? '' : 's'} · ${money(draftTotal())}</span>
        </div>
        <div class="draft-sheet-items">
          ${entries.map(item => `<div class="draft-line">
            <div class="draft-line-copy">
              <strong>${escapeHtml(item.name)}</strong>
              <small>${money(item.price * item.qty)}</small>
            </div>
            <div class="draft-line-controls">
              <div class="quantity-stepper" aria-label="Quantity for ${escapeHtml(item.name)}">
                <button class="quantity-btn" type="button" data-draft-adjust="${item.id}" data-delta="-1" aria-label="Remove one ${escapeHtml(item.name)}">−</button>
                <span class="quantity-value">${item.qty}</span>
                <button class="quantity-btn" type="button" data-draft-adjust="${item.id}" data-delta="1" aria-label="Add one more ${escapeHtml(item.name)}">+</button>
              </div>
            </div>
          </div>`).join('')}
        </div>
        <div class="form-section">
          <label class="form-label" for="draftOrderNote">ORDER NOTE · OPTIONAL</label>
          <textarea class="draft-note" id="draftOrderNote" placeholder="e.g. Drinks first, allergy note…">${escapeHtml(draftOrderNote)}</textarea>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-secondary" id="continueAdding" type="button">Continue adding</button>
          <button class="btn btn-primary" id="sendDraftOrder" type="button">Send · ${money(draftTotal())}</button>
        </div>`;

      draftOrderSheet.querySelector('[data-close="draft-order"]').addEventListener('click', closeDraftOrder);
      draftOrderSheet.querySelectorAll('[data-draft-adjust]').forEach(button => {
        button.addEventListener('click', () => adjustDraftItem(button.dataset.draftAdjust, Number(button.dataset.delta)));
      });
      document.getElementById('draftOrderNote').addEventListener('input', event => {
        draftOrderNote = event.target.value;
      });
      document.getElementById('continueAdding').addEventListener('click', () => {
        closeDraftOrder();
        document.getElementById('menuSearch')?.focus();
      });
      document.getElementById('sendDraftOrder').addEventListener('click', sendDraftOrder);
    }

    function openDraftOrder() {
      if (!draftItemCount()) return;
      renderDraftOrderSheet();
      draftOrderScrim.classList.add('open');
      document.body.style.overflow = 'hidden';
      draftOrderSheet.querySelector('[data-close="draft-order"]')?.focus();
    }

    function closeDraftOrder() {
      draftOrderScrim.classList.remove('open');
      document.body.style.overflow = '';
    }

    function sendDraftOrder() {
      const entries = draftEntries();
      if (!entries.length || !draftTable) return;

      const nextNumber = Math.max(...orders
        .filter(order => order.id.startsWith('A-'))
        .map(order => Number(displayOrderNumber(order.id)) || 0)) + 1;
      const order = {
        id: `A-${nextNumber}`,
        state: 'accepted',
        section: sectionSelect.value === 'all' ? 'terrace' : sectionSelect.value,
        table: draftTable,
        waiter: 'Marko',
        age: 0,
        createdAt: Date.now(),
        total: draftTotal(),
        note: draftOrderNote.trim(),
        items: entries.map(item => ({
          qty: item.qty,
          name: item.name,
          price: item.price * item.qty,
          note: ''
        }))
      };

      orders.unshift(order);
      draftItems.clear();
      draftOrderNote = '';
      menuQuery = '';
      menuCategory = 'All';
      draftTable = null;
      draftGuestName = '';
      selectedTable = null;
      document.getElementById('tableNumber').value = '';
      document.getElementById('guestName').value = '';
      closeDraftOrder();
      renderMyOrders();
      showToast(`Order #${displayOrderNumber(order.id)} created for Table ${order.table}`);
    }

    function emptyMarkup(title, text) {
      return `<div class="empty-state"><div class="empty-icon">${svgTable}</div><h3>${title}</h3><p>${text}</p></div>`;
    }

    function bindCardActions() {
      document.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        openDetail(btn.dataset.open);
      }));
      document.querySelectorAll('[data-accept]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        const order = orders.find(o => o.id === btn.dataset.accept);
        if (!order) return;
        const previousState = order.state;
        const card = btn.closest('.order-card');
        if (card) card.classList.add('card-exit');
        setTimeout(() => {
          order.state = 'accepted';
          updateCounts();
          renderHome();
          showToast(`Order #${displayOrderNumber(order.id)} accepted`, {
            actionLabel: 'Undo',
            duration: 5200,
            onAction: () => {
              order.state = previousState;
              renderHome();
              showToast(`Order #${displayOrderNumber(order.id)} returned to Pending`);
            }
          });
        }, 180);
      }));
      document.querySelectorAll('[data-delivery-accept]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        const order = orders.find(o => o.id === btn.dataset.deliveryAccept);
        if (!order) return;

        const previousWaiter = order.waiter;
        const previousAccepted = Boolean(order.deliveryAccepted);
        const card = btn.closest('.order-card');
        if (card) card.classList.add('card-exit');

        setTimeout(() => {
          order.deliveryAccepted = true;
          order.waiter = 'Marko';
          renderHome();
          showToast(`Order #${displayOrderNumber(order.id)} accepted`, {
            actionLabel: 'Undo',
            duration: 5200,
            onAction: () => {
              order.deliveryAccepted = previousAccepted;
              order.waiter = previousWaiter;
              renderHome();
              showToast(`Order #${displayOrderNumber(order.id)} returned to Delivery`);
            }
          });
        }, 180);
      }));

      document.querySelectorAll('[data-ready]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        showToast(`${btn.dataset.ready} marked ready`);
      }));
      document.querySelectorAll('[data-bill]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        showToast(`Bill flow opened for ${btn.dataset.bill}`);
      }));
      document.querySelectorAll('[data-call]').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        const phone = btn.dataset.call;
        if (!phone) return;

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(phone);
          }
        } catch (_) {
          // Calling still works even if clipboard permission is unavailable.
        }

        showToast(`${phone} ready to call`);
        setTimeout(() => {
          window.location.href = `tel:${phone.replace(/\s+/g, '')}`;
        }, 120);
      }));
    }

    function openDetail(id) {
      const order = orders.find(o => o.id === id);
      if (!order) return;
      const [statusText, statusClass] = statusInfo(order.state);
      detailSheet.innerHTML = `
        <div class="grabber"></div>
        <div class="sheet-head">
          <div>
            <h2 id="detailDialogTitle">${order.state === 'delivery' ? order.fulfillment : `Table ${order.table}`} · Order #${displayOrderNumber(order.id)}</h2>
            <p>${order.state === 'delivery' ? 'Standalone order' : `${sectionLabel(order.section)} section`} · assigned to ${order.waiter}</p>
          </div>
          <button class="icon-btn" data-close="detail" aria-label="Close order details">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="detail-summary">
          <div class="detail-kpi"><small>STATUS</small><strong><span class="status-badge ${statusClass}">${statusText}</span></strong></div>
          <div class="detail-kpi"><small>WAITING</small><strong>${currentAge(order)} min</strong></div>
          <div class="detail-kpi"><small>TOTAL</small><strong>${money(order.total)}</strong></div>
        </div>
        <div class="detail-section">
          <h3>Order information</h3>
          <div class="detail-info-grid detail-info-grid-two">
            <div class="detail-info-item">
              <span>Section</span>
              <strong>${sectionLabel(order.section)}</strong>
            </div>
            <div class="detail-info-item">
              <span>Waiter</span>
              <strong>${order.waiter || '—'}</strong>
            </div>
          </div>
        </div>
        ${order.phone ? `<div class="detail-section">
          <h3>Customer phone</h3>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#f8f8f6;">
            <strong>${order.phone}</strong>
            <button class="btn btn-secondary" data-call="${order.phone}">Call</button>
          </div>
        </div>` : ''}
        <div class="detail-section">
          <h3>Full order</h3>
          ${order.items.map(item => `<div class="detail-item"><strong>${item.qty}×</strong><div class="detail-name"><strong>${item.name}</strong>${item.note ? `<span>${item.note}</span>` : ''}</div><span class="detail-price">${money(item.price)}</span></div>`).join('')}
        </div>
        <div class="detail-section">
          <h3>Order note</h3>
          <div style="padding:12px;border:1px solid var(--line);border-radius:18px;background:#f8f8f6;font-size:12px;color:var(--muted);">${order.note ? escapeHtml(order.note) : 'No order note.'}</div>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-secondary" data-close="detail">Close</button>
          <button class="btn btn-primary" id="primaryDetailAction">${order.state === 'pending' ? 'Accept order' : order.state === 'kds' ? 'Mark ready' : 'Open actions'}</button>
        </div>`;
      detailScrim.classList.add('open');
      document.body.style.overflow = 'hidden';
      detailSheet.querySelector('[data-close="detail"]').focus();
      detailSheet.querySelectorAll('[data-close="detail"]').forEach(b => b.addEventListener('click', closeDetail));
      detailSheet.querySelectorAll('[data-call]').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        const phone = btn.dataset.call;
        if (!phone) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(phone);
          }
        } catch (_) {}
        showToast(`${phone} ready to call`);
        setTimeout(() => {
          window.location.href = `tel:${phone.replace(/\s+/g, '')}`;
        }, 120);
      }));
      document.getElementById('primaryDetailAction').addEventListener('click', () => {
        if (order.state === 'pending') {
          order.state = 'accepted';
          updateCounts();
          closeDetail();
          renderHome();
          showToast(`Order #${displayOrderNumber(order.id)} accepted`);
        } else {
          closeDetail();
          showToast(`Action completed for Order #${displayOrderNumber(order.id)}`);
        }
      });
    }

    function closeDetail() {
      detailScrim.classList.remove('open');
      document.body.style.overflow = '';
    }

    function openManual({ force = false } = {}) {
      if (draftTable && !force) {
        renderOrderBuilder();
        if (draftItemCount()) showToast(`Draft restored for Table ${draftTable}`);
        return;
      }
      manualScrim.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeManual() {
      manualScrim.classList.remove('open');
      document.body.style.overflow = '';
    }

    function showToast(message, options = {}) {
      const { actionLabel = '', onAction = null, duration = 1800 } = options;
      toastMessage.textContent = message;
      toastAction.hidden = !actionLabel;
      toastAction.textContent = actionLabel;
      toast.classList.toggle('actionable', Boolean(actionLabel));
      toastAction.onclick = actionLabel ? () => {
        clearTimeout(showToast.timer);
        toast.classList.remove('show');
        if (onAction) onAction();
      } : null;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function renderCurrentView() {
      if (currentView === 'newOrder') renderOrderBuilder();
      else if (currentView === 'myOrders') renderMyOrders();
      else renderHome();
    }

    function openSearch() {
      topbar.classList.add('searching');
      searchToggle.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => orderSearch.focus());
    }

    function closeSearch({ clear = false } = {}) {
      topbar.classList.remove('searching');
      searchToggle.setAttribute('aria-expanded', 'false');
      if (clear) {
        searchQuery = '';
        orderSearch.value = '';
        searchClear.classList.remove('visible');
        renderCurrentView();
      } else {
        updateSearchChip();
      }
      searchToggle.focus();
    }

    function syncSearch() {
      clearTimeout(syncSearch.timer);
      syncSearch.timer = setTimeout(() => {
        searchQuery = orderSearch.value.trim();
        searchClear.classList.toggle('visible', Boolean(searchQuery));
        updateSearchChip();
        updateSectionAvailability();
        renderCurrentView();
      }, 100);
    }

    function closeLanguageMenu() {
      languageWrap.classList.remove('open');
      languageToggle.setAttribute('aria-expanded', 'false');
    }

    languageToggle.addEventListener('click', e => {
      e.stopPropagation();
      const open = languageWrap.classList.toggle('open');
      languageToggle.setAttribute('aria-expanded', String(open));
    });

    languageOptions.forEach(option => option.addEventListener('click', () => {
      const language = option.dataset.language;
      languageLabel.textContent = language === 'sq' ? 'SQ' : 'MK';
      languageOptions.forEach(item => {
        const active = item === option;
        item.classList.toggle('active', active);
        item.setAttribute('aria-checked', String(active));
      });
      closeLanguageMenu();
      showToast(language === 'sq' ? 'Gjuha: Shqip' : 'Јазик: Македонски');
    }));

    sectionTrigger.addEventListener('click', e => {
      e.stopPropagation();
      if (sectionTrigger.disabled) return;
      closeLanguageMenu();
      const open = sectionMenuWrap.classList.toggle('open');
      sectionTrigger.setAttribute('aria-expanded', String(open));
    });

    sectionOptions.forEach(option => option.addEventListener('click', () => {
      const value = option.dataset.section;
      sectionSelect.value = value;
      sectionTriggerLabel.textContent = sectionTriggerText(value);
      sectionOptions.forEach(item => {
        const active = item === option;
        item.classList.toggle('active', active);
        item.setAttribute('aria-checked', String(active));
      });
      closeSectionMenu();
      updateCounts();
      renderCurrentView();
    }));

    document.addEventListener('click', e => {
      if (!languageWrap.contains(e.target)) closeLanguageMenu();
      if (!sectionMenuWrap.contains(e.target)) closeSectionMenu();
    });

    searchToggle.addEventListener('click', () => {
      closeSectionMenu();
      closeLanguageMenu();
      openSearch();
    });
    searchBack.addEventListener('click', () => closeSearch({ clear: false }));
    orderSearch.addEventListener('input', syncSearch);
    searchClear.addEventListener('click', () => {
      orderSearch.value = '';
      syncSearch();
      orderSearch.focus();
    });
    activeSearchMain.addEventListener('click', openSearch);
    activeSearchClear.addEventListener('click', () => {
      searchQuery = '';
      orderSearch.value = '';
      searchClear.classList.remove('visible');
      updateSearchChip();
      updateSectionAvailability();
      renderCurrentView();
    });

    tabs.forEach((tab, index) => tab.addEventListener('click', () => {
      activeState = tab.dataset.state;
      document.querySelector('.state-nav').style.setProperty('--active-index', index);
      tabs.forEach(t => {
        const active = t === tab;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', String(active));
      });
      if (currentView !== 'home') {
        currentView = 'home';
        homeNav.classList.add('active');
        myOrdersNav.classList.remove('active');
        document.querySelector('.state-nav-wrap').style.display = '';
      }
      updateSectionAvailability();
      renderHome();
    }));

    sectionSelect.addEventListener('change', () => {
      sectionTriggerLabel.textContent = sectionTriggerText(sectionSelect.value);
      sectionOptions.forEach(item => {
        const active = item.dataset.section === sectionSelect.value;
        item.classList.toggle('active', active);
        item.setAttribute('aria-checked', String(active));
      });
      updateCounts();
      renderCurrentView();
    });

    homeNav.addEventListener('click', renderHome);
    if (myOrdersViewTrigger && myOrdersViewMenu) {
      myOrdersViewTrigger.addEventListener('click', event => {
        event.stopPropagation();
        const willOpen = myOrdersViewMenu.hidden;
        closeSectionMenu();
        languageWrap.classList.remove('open');
        languageToggle.setAttribute('aria-expanded', 'false');
        myOrdersViewMenu.hidden = !willOpen;
        myOrdersViewTrigger.setAttribute('aria-expanded', String(willOpen));
        myOrdersViewTrigger.classList.toggle('open', willOpen);
      });

      myOrdersViewOptions.forEach(option => {
        option.addEventListener('click', event => {
          event.stopPropagation();
          const nextMode = option.dataset.myordersView;
          if (!nextMode) return;
          myOrdersViewMode = nextMode;
          closeMyOrdersViewMenu();
          renderMyOrders();
        });
      });
    }

    document.addEventListener('click', event => {
      if (myOrdersHeaderFilter && !myOrdersHeaderFilter.contains(event.target)) {
        closeMyOrdersViewMenu();
      }
    });

    myOrdersNav.addEventListener('click', renderMyOrders);
    createOrderBtn.addEventListener('click', openManual);

    detailScrim.addEventListener('click', e => { if (e.target === detailScrim) closeDetail(); });
    manualScrim.addEventListener('click', e => { if (e.target === manualScrim) closeManual(); });
    draftOrderScrim.addEventListener('click', e => { if (e.target === draftOrderScrim) closeDraftOrder(); });
    document.querySelectorAll('[data-close="manual"]').forEach(b => b.addEventListener('click', closeManual));

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (detailScrim.classList.contains('open')) closeDetail();
        else if (manualScrim.classList.contains('open')) closeManual();
        else if (draftOrderScrim.classList.contains('open')) closeDraftOrder();
        else if (languageWrap.classList.contains('open')) closeLanguageMenu();
        else if (sectionMenuWrap.classList.contains('open')) closeSectionMenu();
        else if (topbar.classList.contains('searching')) closeSearch({ clear: false });
      }
    });

    const tableNumberInput = document.getElementById('tableNumber');
    tableNumberInput.addEventListener('input', () => {
      const digitsOnly = tableNumberInput.value.replace(/\D/g, '').slice(0, 3);
      if (tableNumberInput.value !== digitsOnly) tableNumberInput.value = digitsOnly;
      selectedTable = digitsOnly ? Number(digitsOnly) : null;
    });

    document.getElementById('continueManual').addEventListener('click', () => {
      if (!selectedTable || selectedTable < 1) {
        showToast('Enter a valid table number');
        tableNumberInput.focus();
        return;
      }
      draftTable = selectedTable;
      draftGuestName = document.getElementById('guestName').value.trim();
      closeManual();
      renderOrderBuilder();
    });

    updateCounts();
    updateSectionAvailability();
    renderHome();
    setInterval(refreshAgeBadges, 30_000);
  </script>


<script>
(() => {
  /* WCAG keyboard and focus-management layer. */

  let lastFocusedBeforeDialog = null;

  const focusableSelector = [
    'button:not([disabled])',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])',
    'a[href]',
    '[tabindex]:not([tabindex="-1"])'
  ].join(',');

  function visibleFocusable(container) {
    return [...container.querySelectorAll(focusableSelector)].filter(el => {
      const style = window.getComputedStyle(el);
      return !el.hidden &&
        style.display !== 'none' &&
        style.visibility !== 'hidden' &&
        el.getClientRects().length > 0;
    });
  }

  function rememberFocus() {
    lastFocusedBeforeDialog = document.activeElement instanceof HTMLElement
      ? document.activeElement
      : null;
  }

  function restoreFocus() {
    const target = lastFocusedBeforeDialog;
    lastFocusedBeforeDialog = null;
    window.setTimeout(() => {
      if (target && document.contains(target)) {
        target.focus();
      } else {
        const fallback = document.querySelector('.nav-btn.active') || document.getElementById('homeNav');
        if (fallback) fallback.focus();
      }
    }, 0);
  }

  function trapDialogFocus(scrim) {
    scrim.addEventListener('keydown', event => {
      if (!scrim.classList.contains('open') || event.key !== 'Tab') return;

      const focusables = visibleFocusable(scrim);
      if (!focusables.length) {
        event.preventDefault();
        return;
      }

      const first = focusables[0];
      const last = focusables[focusables.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
  }

  const detailDialog = document.getElementById('detailScrim');
  const manualDialog = document.getElementById('manualScrim');
  const draftOrderDialog = document.getElementById('draftOrderScrim');

  if (detailDialog) trapDialogFocus(detailDialog);
  if (manualDialog) trapDialogFocus(manualDialog);
  if (draftOrderDialog) trapDialogFocus(draftOrderDialog);

  /* Capture focus before either modal opens. */
  const createOrderBtn = document.getElementById('createOrderBtn');
  if (createOrderBtn) {
    createOrderBtn.addEventListener('click', rememberFocus, { capture: true });
  }

  document.addEventListener('click', event => {
    const opener = event.target.closest('[data-open]');
    const draftOpener = event.target.closest('#draftDockReview');
    if (opener || draftOpener) rememberFocus();
  }, true);

  /* Move focus into the manual-order dialog when it opens. */
  if (manualDialog) {
    const manualObserver = new MutationObserver(() => {
      if (manualDialog.classList.contains('open')) {
        const tableInput = document.getElementById('tableNumber');
        if (tableInput) window.setTimeout(() => tableInput.focus(), 0);
      }
    });
    manualObserver.observe(manualDialog, { attributes: true, attributeFilter: ['class'] });
  }

  /* Restore focus after dialogs close. */
  [detailDialog, manualDialog, draftOrderDialog].forEach(dialog => {
    if (!dialog) return;
    let wasOpen = dialog.classList.contains('open');
    const observer = new MutationObserver(() => {
      const isOpen = dialog.classList.contains('open');
      if (wasOpen && !isOpen) restoreFocus();
      wasOpen = isOpen;
    });
    observer.observe(dialog, { attributes: true, attributeFilter: ['class'] });
  });

  /* Proper keyboard interaction for the state tablist. */
  const stateTabs = [...document.querySelectorAll('.state-tab[role="tab"]')];

  function syncStateTabStops() {
    stateTabs.forEach(tab => {
      tab.tabIndex = tab.getAttribute('aria-selected') === 'true' ? 0 : -1;
    });
  }

  stateTabs.forEach((tab, index) => {
    tab.addEventListener('click', syncStateTabStops);

    tab.addEventListener('keydown', event => {
      let nextIndex = null;

      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        nextIndex = (index + 1) % stateTabs.length;
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        nextIndex = (index - 1 + stateTabs.length) % stateTabs.length;
      } else if (event.key === 'Home') {
        nextIndex = 0;
      } else if (event.key === 'End') {
        nextIndex = stateTabs.length - 1;
      }

      if (nextIndex !== null) {
        event.preventDefault();
        const next = stateTabs[nextIndex];
        next.focus();
        next.click();
      }
    });
  });

  syncStateTabStops();

  /* aria-current is kept in sync with visual bottom-navigation state. */
  const homeNavA11y = document.getElementById('homeNav');
  const myOrdersNavA11y = document.getElementById('myOrdersNav');
  const createOrderNavA11y = document.getElementById('createOrderBtn');

  function syncCurrentPage() {
    [homeNavA11y, createOrderNavA11y, myOrdersNavA11y].forEach(btn => {
      if (!btn) return;
      if (btn.classList.contains('active')) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
  }

  const bottomNav = document.querySelector('.bottom-nav');
  if (bottomNav) {
    new MutationObserver(syncCurrentPage).observe(bottomNav, {
      subtree: true,
      attributes: true,
      attributeFilter: ['class']
    });
  }
  syncCurrentPage();

  /* Generic radio-menu keyboard support for section/language dropdowns. */
  function enhanceRadioMenu(trigger, menu, getOpenState, openMenu, closeMenu) {
    if (!trigger || !menu) return;

    const options = () => [...menu.querySelectorAll('[role="menuitemradio"]')];

    function focusPreferred() {
      const items = options();
      const selected = items.find(item => item.getAttribute('aria-checked') === 'true');
      (selected || items[0])?.focus();
    }

    trigger.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!getOpenState()) openMenu();
        window.setTimeout(focusPreferred, 0);
      }
    });

    menu.addEventListener('keydown', event => {
      const items = options();
      const current = items.indexOf(document.activeElement);
      if (!items.length) return;

      let next = null;

      if (event.key === 'ArrowDown') next = current < 0 ? 0 : (current + 1) % items.length;
      if (event.key === 'ArrowUp') next = current < 0 ? items.length - 1 : (current - 1 + items.length) % items.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = items.length - 1;

      if (next !== null) {
        event.preventDefault();
        items[next].focus();
      }

      if (event.key === 'Escape') {
        event.preventDefault();
        closeMenu();
        trigger.focus();
      }
    });
  }

  const languageTriggerA11y = document.getElementById('languageToggle');
  const languageMenuA11y = document.getElementById('languageMenu');
  const languageWrapA11y = document.getElementById('languageWrap');

  enhanceRadioMenu(
    languageTriggerA11y,
    languageMenuA11y,
    () => languageWrapA11y?.classList.contains('open'),
    () => {
      if (!languageWrapA11y?.classList.contains('open')) languageTriggerA11y?.click();
    },
    () => {
      languageWrapA11y?.classList.remove('open');
      languageTriggerA11y?.setAttribute('aria-expanded', 'false');
    }
  );

  const sectionTriggerA11y = document.getElementById('sectionTrigger');
  const sectionMenuA11y = document.getElementById('sectionMenu');
  const sectionWrapA11y = document.getElementById('sectionMenuWrap');

  enhanceRadioMenu(
    sectionTriggerA11y,
    sectionMenuA11y,
    () => sectionWrapA11y?.classList.contains('open'),
    () => {
      if (!sectionWrapA11y?.classList.contains('open')) sectionTriggerA11y?.click();
    },
    () => {
      sectionWrapA11y?.classList.remove('open');
      sectionTriggerA11y?.setAttribute('aria-expanded', 'false');
    }
  );

  /* My Orders Detailed / Compact menu: keyboard-complete menu behavior. */
  document.addEventListener('keydown', event => {
    const menu = document.getElementById('myOrdersViewMenu');
    const trigger = document.getElementById('myOrdersViewTrigger');
    if (!menu || !trigger) return;

    if (document.activeElement === trigger &&
        (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
      event.preventDefault();
      if (menu.hidden) trigger.click();
      const items = [...menu.querySelectorAll('[role="menuitemradio"]')];
      const selected = items.find(item => item.getAttribute('aria-checked') === 'true') || items[0];
      window.setTimeout(() => selected?.focus(), 0);
      return;
    }

    if (menu.hidden || !menu.contains(document.activeElement)) return;

    const items = [...menu.querySelectorAll('[role="menuitemradio"]')];
    const current = items.indexOf(document.activeElement);
    let next = null;

    if (event.key === 'ArrowDown') next = (current + 1) % items.length;
    if (event.key === 'ArrowUp') next = (current - 1 + items.length) % items.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = items.length - 1;

    if (next !== null) {
      event.preventDefault();
      items[next]?.focus();
    }

    if (event.key === 'Escape') {
      event.preventDefault();
      menu.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
      trigger.classList.remove('open');
      trigger.focus();
    }
  });
})();
</script>

<script>
  /* Launch installed PWAs in standalone mode so Android paints the system
     area with the app theme. On the first gesture, DOM fullscreen makes
     Chromium re-apply viewport-fit=cover using short-edge cutout mode. */
  (() => {
    const nativeSource = new URLSearchParams(window.location.search).get('source');
    const nativeWrapper = nativeSource === 'twa' || nativeSource === 'android';
    const installedApp =
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (nativeWrapper || !installedApp || !document.documentElement.requestFullscreen) return;

    const stopListening = () => {
      document.removeEventListener('click', enterCutoutFullscreen, true);
      document.removeEventListener('keydown', enterCutoutFullscreen, true);
    };

    const enterCutoutFullscreen = () => {
      if (document.fullscreenElement) {
        stopListening();
        return;
      }

      document.documentElement.requestFullscreen()
        .then(stopListening)
        .catch(() => {
          /* Keep listening so a later user gesture can retry. */
        });
    };

    document.addEventListener('click', enterCutoutFullscreen, true);
    document.addEventListener('keydown', enterCutoutFullscreen, true);
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
  }
</script>
